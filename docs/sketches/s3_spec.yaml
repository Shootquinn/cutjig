rubric_additions:
  - "V1: floor at the bottom; the NEMA 17 hangs under the anchor block on standoffs, the nut sits in the ring housing (K8 below / above predicates)"
  - "V5: screw c vertical, fixed anchor at the bottom (bearing line below the nut in every pose, S3-1), radial top guide at the top, nut on the ring (K8 anchor below nut below guide)"
  - "section handedness: viewer at +X, u = +Y right; screw c and member c on the left (u < 0), pinion c and NEMA 23 c on the right (u > 0) (K8 side predicates on screw_c, frame_upper_c, motor23_c, pinion_c)"
  - "inset handedness: +X right, +Y up, theta counter-clockwise from +X seen from +Z; screws at 30, 150, 270; A-A on x = 0 with arrows toward -X (K8 per Axes, TP-7)"
  - "V6: rectangles in the section, circles only in the inset (and balls as circles, admitted sub-artists)"
  - "V7: the screw reads as a screw with a fixed anchor (two bearings between shoulder, cover and locknut), a floating nut in a counterbored boss held by shoulder screws with axial play, and a radial guide; the motor as body, pilot and shaft on standoffs (visual-only)"
  - "V10: the operator rows of gameplan detail 1 common for S3, judged on fixed parts (couplings, standoffs, motor shafts) and on nut_station_park for the ring at load (load tip = park tip) (visual-only)"

# Reported items (RPT; Designer 1.3 (a) section 12). checks_s3.reported(ctx)["items"] supplies each value.
reported_items:
  - {id: L_min, text: "screw length L_min per Q9 option and at the drawn anchor, against DN23 800 to 900 (885.00 / 885.84 / 1135.00 unchanged)", source: "check_stack.reported q9_options L (spec screw_length)", needs_drawing: false}
  - {id: n_crit, text: "critical speed over L_t with the end factor stated, against the rapid traverse", source: "jackscrew.root_diameter, youngs_modulus, density, anchor_bearing_z, guide_bearing_z; liftload.rapid_speed, jackscrew.lead", needs_drawing: false}
  - {id: pcr_margin, text: "P_cr / F per compression case (static, capture lift, retract with bind, stall up), per mounting and K, per screw and two-screw", source: "s3_checks.S3-2 inputs; load_cases", needs_drawing: false}
  - {id: f_stall, text: "F_stall total and per screw, both directions, mu range", source: "liftmotor.holding_torque, jackscrew.lead, mean_diameter, thread_mu, thread_half_angle", needs_drawing: false}
  - {id: wob_max, text: "largest WOB at holding torque (F_stall + W) against loads.axial_design 1000", source: "F_stall, W (load_cases.W_kg), loads.axial_design", needs_drawing: false}
  - {id: lift_torque, text: "motor torque per screw for the cut and for capture lift, against liftmotor.holding_torque", source: "load_cases, jackscrew.lead, eta over thread_mu", needs_drawing: false}
  - {id: kept_axial, text: "axial force in collet (core seat), receiver, base plate at 1000 N and at F_stall + W (N5); the holder is outside the cut-case route (Topologist TP1.3-10 (a))", source: "loads.axial_design; F_stall + W", needs_drawing: false}
  - {id: backdrive, text: "lead angle against friction angle, back-drive efficiency", source: "jackscrew.lead, mean_diameter, thread_mu, thread_half_angle", needs_drawing: false}
  - {id: screw_share, text: "per-screw (load / 3) and two-screw (load / 2) force per case", source: "load_cases", needs_drawing: false}
  - {id: tension_segment, text: "screw length in tension below the nut per S1 pose in the cut case", source: "drawn anchor bearing line (anchor_bearing_c:line) and check_stack nut_z per pose", needs_drawing: true}
reported:
  - "the reported_items above (RPT); no threshold, never asserted"

