# S3 spec, section A-A through jack screw c with a plan inset of all three screws (contributor gameplan (sean) detail 1.3).
# Written at 1.3 (b) by The Engineer, 2026-11-26, from research/sean/cr_scratch/step1.3_designer_params_review.md and Sean's
# rulings (gameplan Design Notes 4: section through screw c, theta 270, YZ plane; Design Notes 31: Tr12x3 single start,
# fixed anchor of two angular-contact bearings back-to-back in a 42-square block 30 tall, K 0.7 on L_t 870, floating nut,
# self-locking lead as the power-off hold, SF 3 in every case incl. stall, F_bind 300 N, single controller with a home
# switch per screw). No drawing before the signed spec. Report: research/sean/cr_scratch/step1.3_engineer_spec.md.
#
# Shared rows (X1: place, z_rule, plan_poly equal to s1_spec.yaml / s2_spec.yaml after whitespace normalisation) are copied
# unchanged in those fields; S3 adds shape, neighbours, section_u, axes, section_class. anchor_a/_b/_c: the 42-square
# place (Design Notes 31) is in all three specs from 1.3 P6 (S1 r8, S2 r9); no x1_exempt remains.
# 1.3 P6 edits (The Engineer, research/sean/cr_scratch/step1.3_engineer_draw_r1.md, orchestrator-named exceptions):
# x1_exempt removed (a); P4 findings F2 (nut_c, guide_c projection rectangle) and F3 (motor_shaft_c outboard side form)
# and the Topologist mirror_about_radial declaration on the 12 radial inset rows (e); receiver shoulder D200 x 8 on the
# plate top, base_plate|receiver face, chains a, b, c certified by the S3 section alone (Design Notes 32) (f).
#
# New spec fields at 1.3 (b) (declared here; check_stack ignores them today; K3 to K9 read them from P4 (c)):
#   view section_yz: section plane x = 0, figure u = +Y (right), z up, plotted z_S; viewer at +X looking toward -X;
#     (u, z, toward viewer) = (+Y, +Z, +X), right-handed. Depth (along the plane normal) is the place / plan x extent; for a
#     row with neither, `depth` here is its x band. check_stack today hulls depth with the place y extent (side_xz); the
#     section_yz depth from place x is a P4 harness item (O4).
#   axes: the Axes a row is drawn in: section (main Axes) and/or inset_plan (the inset). K3 to K9 iterate per Axes (TP-7, P4).
#   projection_by_axes: projection per Axes for a row drawn in both (8.4.1: rectangle in the section, circle in plan).
#   section_class: cut (hatched where the plane cuts it), unsectioned (axis in the plane, ASME Y14.3: outline over the hatch
#     around it), beyond (elevation behind the plane within one profile width, 0 > x >= -profile.width; edges behind a cut
#     part dashed), reference (lines, dimensions; no area). Parts beyond 60 or in front of the plane (x > 0) are not drawn
#     (not_drawn, figure note). A cut row draws its section only; its far half is not drawn again.
#   section_u: true-section pieces in the plane, each [u_lo, u_hi, z_lo, z_hi] (u signed along +Y, z in z_A stack names);
#     used where the cut is not symmetric about the drill axis or not centred on it (screw set c at u = -160, ring, plate,
#     rails, member c). `section` [r_in, r_out(, z_lo, z_hi)] keeps its S1 meaning (axis-Z annulus mirrored about u = 0).
#   hatch: material class for the hatch legend (aluminium, extrusion, steel, brass, plastic).
#   sub_artists: <row>:<sub> sub-artists the row may carry (balls, line, lever), admitted by K5 / K9 at P4 under the
#     Topologist P0T section 4 pattern (mark admission); each needs its own Z and B there.
#   leaders_to, value_from (callout and arrow labels), sense predicates look_direction, axes_not_inverted, points: P4.
status: "draft for signature (Designer part list, Loftsman); 1.3 (b), The Engineer, 2026-11-26; P2f fix pass (Designer FIX 1 to 6, Loftsman FIX 1 to 6, orchestrator rulings); P2f2 (Designer re-sign FIX A to D, Loftsman FIX 8; nut shoulder screws per the revised orchestrator ruling), research/sean/cr_scratch/step1.3_engineer_spec_fixes.md; 1.3 P6 edits (a), (e), (f), step1.3_engineer_draw_r1.md; 1.3 (h) r2 edits for Designer re-sign (chain link kinds and the base-route reroute TP1.3-10, not_drawn omit fields TP1.3-12, plan_axes arc TP1.3-13, screw_c root lines TP1.3-15, lever u expressions TP1.3-19), step1.3_engineer_revision_r2.md; 1.3 (h) r3 edits (Designer r2 values picks 2, 3 (offset per orchestrator ruling u -110), 4 ('--' per orchestrator ruling), 5, 7, 8, 9; Loftsman LF1.3-10; Topologist R2-5), step1.3_engineer_revision_r3.md"
sketch: s3
script: s3_jackscrew_section.py    # K1 scans this file at 1.3 (d)
view: section_yz
section:
  id: A-A
  plane: "x = 0 (YZ plane through the drill axis and screw c at (0, -160))"
  look: "from +X toward -X"
  axes: {u: "+Y, right", z: "+Z, up (z_S plotted)", toward_viewer: "+X"}
  handedness: "u x z = toward viewer: Y x Z = X (right-handed); u equals plan y, so plan values read with no sign change"
  convention: {cut: "hatched, one pattern per material, legend in the figure note; hidden lines inside a cut part not drawn", unsectioned: "screw c, NEMA 17 shaft, NEMA 23 shaft c, coupling, standoffs, balls (circles): outline over the hatch of the part around them (ASME Y14.3)", beyond: "within 0 > x >= -profile.width, elevation, visible edges solid, edges behind a cut part dashed (renderer section convention, P4)", omitted: "beyond x < -profile.width and in front (x > 0): not drawn, listed in the figure note"}
  source: "Designer 1.3 (a) section 2; gameplan Design Notes 4 (screw c, Sean STOP S3-0)"
  hatch_alt: {aluminium: "--"}   # 1.3 (h) r3: anchor cover above the joint (Designer r2 pick 4; '////' refused by the line-family lint, Topologist R2-4; orchestrator ruling '--')
section_figure: {name: s3_jackscrew_section, pose: capture_end, png: "s3_jackscrew_section_r<k>.png", note: "one figure: section A-A at capture_end (cut case, loop closed) with the plan inset; nut stations at start and park as dash-dot ticks (rows nut_station_start, nut_station_park)"}
insets:
  - id: inset_plan
    view: plan_xy
    title: "end view (plan, seen from +Z)"
    look: "+Z toward -Z; +X right, +Y up, theta counter-clockwise from +X (as S2)"
    extent: {x: [-340, 340], y: [-340, 340], aspect: equal}
    position: "upper right of the figure, height at least 0.3 of the figure height"
    pose: capture_end
    rows: [screw_a, screw_b, screw_c, nut_housing_a, nut_housing_b, nut_housing_c, anchor_a, anchor_b, anchor_c, liftmotor_a, liftmotor_b, liftmotor_c, frame_upper_a, frame_upper_b, frame_upper_c, home_switch_a, home_switch_b, home_switch_c, keepout, ring_ref, section_line, plan_axes, sync_callout]
    checks: "its own Axes: K3 to K9 per Axes (TP-7, P4 (c)); K5 circles admitted here only; K8 handedness: screws at 30, 150, 270 counter-clockwise, section line on x = 0 looking toward -X; K9 sees all three screws and the sync callout"
    source: "Designer 1.3 (a) section 2 (inset); gameplan detail 1.3 Shows (plan inset, circles allowed)"
z_rule_frame: z_A
plot_frame: z_S
question: >-
  How is each screw anchored, guided, driven and synced, does the 1000 N axial load put it in tension, what holds the
  ring with power off, and does the axial load loop close?
closes:
  R: [R14]
  Q: [Q7, Q8]
  design_notes: ["DN23 sync and anchoring items", "TR10/TR12 fallback check (Tr12x3 adopted, Design Notes 31)", "axial-loop half of SE-2 (Design Notes 16)"]
  carries_assumed: [Q2]
k7_tolerance: "G passes at distance >= g_min - 0.05 mm; C at distance <= 0.05 mm and overlap <= 0.01 mm2; F at overlap <= 0.01 mm2 (sketch_common TOL_C, TOL_AREA; LF-9). Section view: disjoint depth bands along X (plane normal) settle F only; a G pair passes on max(band gap, in-plane distance) >= g_min - 0.05; a C pair fails when the band gap exceeds 0.05 (LF-1 rule, depth along X). Every place footprint contains its part; plan-contact as S1 on true plan sections. A neighbour with poses declares the pair at those poses only. Inset: plan rules of S2 per Axes."

# Stack fields as S1 (one pose stack, Design Notes 22, 23).
q9_length_keys: [core.length_capture, core.length_install]
always_loaded: [core.length_install]
q9_options:
  "0.5 m only": [core.length_capture]
  "0.5 and 0.75 m": [core.length_capture, core.length_install]
  "plus 1 m": [core.length_capture, core.length_install, core.length_optional]
capture_core: core_750
capture_core_length: core.length_install
load_plane: {term: core_stop, feature: core_seat, edge: z_max, offset: 0}
entry_plane: {term: collar_top, feature: collar, edge: z_max, offset: 0}
stack_ties:
  - {id: member_top_c, term: top_guide, feature: frame_upper_c, edge: z_max, offset: "-profile.height", source: "Loftsman 1.2 (b) NOTE 2; overlay frame_upper.member_length_rail expr (K2); 1.3 step 0 R2; as s2_spec.yaml"}
symbols:
  c: {domain: [0, null], unit: mm, owner: "Sean (N11)", source: "Design Notes 23 (FIX 5 ruling); as s1_spec.yaml symbols.c", status: "no value; reported as an expression"}
park_rule:
  stop_k: "max(stop.height_z, collet.core_stop_z + L + stop.g_stop - drill.bore_ceiling_above_tip, collet.core_stop_z + L + c - upper.travel_max)"
  start_k: "stop_k + upper.travel_max"
  park: "max(max_k start_k, entry_plane + max L) + upper.load_clearance"
  for_step4: "as s1_spec.yaml park_rule.for_step4"
# Screw length per Q9 option (reported, never asserted): the S1 expressions (Loftsman 1.1 (b) ruling). g_min_screw_block is
# read from nut_housing_c|anchor_c and |guide_c (check_stack.screw_block_g_min, screw letters a, b, c from 1.3 (b)).
screw_length:
  L_min: "stroke + jackscrew.anchor_allowance + jackscrew.guide_allowance + max(jackscrew.nut_length, ring.nut_housing_height) + 2 * g_min_screw_block"
  at anchor_z: "park + ring.position_above_tip + ring.thickness / 2 + max(jackscrew.nut_length, ring.nut_housing_height) / 2 + jackscrew.guide_allowance + g_min_screw_block - jackscrew.anchor_z"
undeclared_pairs: F
poses:
  - id: load
    tip_z: park_tip
    vars: {capture_core_bottom: "collet.core_stop_z + 0.5 * (stop.collar_top_z - collet.core_stop_z)"}
    purpose: "stack only (S3-1 nut position; operator rows V10); not drawn"
  - id: start
    tip_z: "stop.start_z[0]"
    vars: {capture_core_bottom: core_stop}
    purpose: "stack only (S3-1 nut position; nut station tick, row nut_station_start); not drawn"
  - id: capture_end
    tip_z: "stop.height_z"
    vars: {capture_core_bottom: core_stop}
    purpose: "the drawn pose: cut case at the end of the cut, loop closed, ring low beside the anchor (ring 314.84 to 326.84, nut c centre 320.84 z_A)"
  - id: park
    tip_z: park_tip
    purpose: "stack only (S3-1, S3-2 rigid segment, home-switch G pairs, swept case top); nut station tick, row nut_station_park; not drawn"

# Load cases (gameplan detail 1.3; Designer 1.3 (a) section 6; Sean STOP S3-A, Design Notes 31). Per screw = load / 3 (equal
# share ASSUMED), two-screw = load / 2 (reported). W from the overlay masses (W_kg below, 24.25 kg). g = 9.81 m/s2 (standard
# gravity; no params key). F_stall per screw = 2 pi liftmotor.holding_torque eta / lead, eta = tan(lambda) / tan(lambda +
# phi_n), lambda = atan(lead / (pi mean_diameter)), phi_n = atan(mu / cos(thread_half_angle)), at both ends of thread_mu.
# Values DERIVED (hand, step1.3_engineer_spec.md section 4); checks_s3 computes them from the keys at run time.
load_cases:
  W_kg: "ring.mass + drill.mass + gear.mass + pinion.count * pinion.motor_mass + jackscrew.count * jackscrew.nut_mass + bearing.mass + pinion.count * pinion.mass + gear.hub_mass + guide.count * guide.bushing_mass + drill.top_block_mass"   # 1.3 (h) r3: top-end block in W (Designer r2 pick 7, LF1.3-2); 26.25 kg
  g: 9.81
  cases:
    - {id: static, total: "W", direction: down, per_screw: 85.84, two_screw: 128.76, segment_below_nut: compression, kept_parts: 0, s3_2: true}
    - {id: capture_lift, total: "W + liftload.core_mass_capture (10.4 kg)", direction: down, per_screw: 119.85, two_screw: 179.77, segment_below_nut: compression, kept_parts: 0, s3_2: true}
    - {id: retract_bind, total: "W + liftload.f_bind", direction: down, per_screw: 185.84, cap: "F_stall per screw (343.18 at mu 0.15)", two_screw: 278.76, segment_below_nut: compression, kept_parts: 0, s3_2: true}
    - {id: cut, total: "loads.axial_design - W", direction: "up on the cutter; the screws push the ring down", per_screw: 247.50, two_screw: 371.24, segment_below_nut: tension, stress_MPa: 4.36, kept_parts: "1000 compression (collet with its core seat, receiver, base plate; holder outside the route, TP1.3-10 (a)); plate also takes 495.00 up at members a, b; member c's 247.50 goes to the -Y rail", s3_1: true}
    - {id: stall_down, total: "3 F_stall", direction: "down into a jam through the cutter", per_screw: "343.18 / 282.21 (mu 0.15 / 0.20)", segment_below_nut: tension, kept_parts: "F_stall + W = 1287.05 / 1104.16"}
    - {id: stall_up, total: "3 F_stall", direction: "up at the top of travel", per_screw: "343.18 / 282.21 (mu 0.15 / 0.20)", segment_below_nut: compression, kept_parts: 0, s3_2: true}
  source: "gameplan detail 1.3 load cases; Designer 1.3 (a) section 6 (Correction 1 masses, Correction 9 retract cap); Sean STOP S3-A, Design Notes 31 (F_bind 300 N, SF 3, masses ASSUMED)"

# S3 checks (gameplan detail 1.3 table; read by checks_s3.py).
s3_checks:
  S3-1:
    screw: screw_c
    anchor_line: anchor_bearing_c        # drawn bearing line (sub-artist anchor_bearing_c:line), spec z jackscrew.anchor_bearing_z
    nut: nut_c
    nut_positions: [load, start, capture_end, park]     # every nut position from the S1 poses (check_stack nut_z per pose)
    case: cut
    load_arrow: load_cut                 # drawn cut arrow must point +Z
    rule: "tension in the screw segment between the anchor bearing line and the nut when the cut load acts up on the ring: anchor line below the nut bottom at every nut position (z_nut_bottom - z_anchor_line > 0) and the cut arrow pointing +Z; a segment with the anchor above the nut reads compression and fails"
    source: "[DN23]; gameplan detail 1.3 S3-1"
  S3-2:
    form: threshold                      # Sean STOP S3-A, Design Notes 31: option (i), threshold kept (SF 3 in every case, stall included)
    mounting: floating
    column: {from: anchor_bearing_c, to: guide_bearing_c, length: "jackscrew.guide_bearing_z - jackscrew.anchor_bearing_z", read: "drawn bearing-line z of both rows (centres of their drawn pieces), equal to the expression within 0.05", K: jackscrew.end_factor_floating}
    alternative: {mounting: rigid, length: "park nut centre - jackscrew.anchor_bearing_z (row nut_station_park)", K: jackscrew.end_factor_rigid, reported_only: true}
    d_r: jackscrew.root_diameter
    E: jackscrew.youngs_modulus
    sf: jackscrew.buckling_sf
    cases: [static, capture_lift, retract_bind, stall_up]
    core_mass: liftload.core_mass_capture   # 10.4 kg (Designer 1.3 (b) section 7 item 9)
    stall: {torque: liftmotor.holding_torque, lead: jackscrew.lead, starts: jackscrew.starts, mean_diameter: jackscrew.mean_diameter, mu: jackscrew.thread_mu, half_angle: jackscrew.thread_half_angle, governing: "mu low end (largest F_stall)"}
    rule: "P_cr = pi^2 E I / (K L)^2, I = pi d_r^4 / 64; pass when P_cr / F >= sf for every case at the per-screw force; retract capped at F_stall per screw"
    expected: {P_cr_N: 1363.8, least_margin: "3.97 (stall_up, mu 0.15)", margins: {static: 15.89, capture_lift: 11.38, retract_bind: 7.34, stall_up: 3.97}}
    source: "[DN23]; Design Notes 31 (SF 3, K 0.7 credit, F_bind 300 N); inputs ASSUMED"
  S3-3:
    form: cross_record                   # 1.3 open O11; P4 implements
    records: "certifiers name sketch and pair id; S3-3 resolves each at run time to the latest accepted, unsuperseded record of that sketch (check_sketch.stale_records); premise: --stale clean on it, checked inside S3-3 (a stale record certifies nothing); S3 is accepted after S1 r8 and S2 r9 (Loftsman 1.3 (b) FIX 6)"
    this_figure: "K7 entries of this S3 run (section Axes, capture_end) for pairs certified by S3"
    case: cut
    rule: "every consecutive pair of each screw chain (field chains) is class C, as an axial face contact that carries the cut-case load in its direction (the named face of each S3 certifier, field face) in the section, in at least one certifier named for it (state C, z-contact or plan-contact); a pair whose certifier is 'declared' passes only as declared and is listed; a pair with no certifier fails; the a, b screw-set pairs are certified from screw c only under the symmetry premise lint (P4)"
    source: "SE-2; gameplan detail 1.3 S3-3; Designer 1.3 (a) section 11"

# S3-3 chains, cut case (Designer 1.3 (a) section 11). 1.3 (h) r2 (Topologist TP1.3-10): every link carries a kind.
#   face: an axial face that carries the cut-case load in its direction; named face {z} on the link or on the neighbour
#     entry; judged in the section with its sense (x's drawn bottom edge and y's drawn top edge on the face z, overlap in
#     u above 0.05: x above y, x holds y down under the cut-case loop force); an S3 certifier is required.
#   face_record: an axial face off the section plane (plate on the base-frame rails); certified by record contact as
#     before, sense not read in this figure (listed).
#   thread, one_body: contact certifiers as before.
#   fastened: the drawn contact is a side face or a face loaded in tension (member feet, bracket arm ends); the link is
#     carried by fasteners (Step 2 bolt row); contact certifiers as before, listed.
#   declared: passes as declared and is listed (load application; ring and bearing radial fits, axial seats at S6-5).
# The base route runs core, core seat (one body with the collet), collet foot on the receiver floor, receiver shoulder on
# the plate (Topologist TP1.3-10 (a)); the holder carries no cut-case axial load in the drawing. certifiers: record and K7 pair id as written in that record
# (MEASURED in S1 / S2 at 1.3 (b)); "S3" = this figure's K7 (section Axes); "declared" =
# declared contact, drawn at S6 (S6-5); "none" = no record certifies it today (listed in step1.3_engineer_spec.md section 5).
chains:
  c:
    - {pair: [drill_head, core_750], kind: declared, certifiers: ["declared: load application (the cut force acts between cutter and core; row load_cut, S3-1 reads it +Z)"], note: "K7 holds head and core N by design; no record can certify it C (Loftsman 1.3 (b) FIX 6 (b))"}
    - {pair: [core_750, core_seat], kind: face, face: {z: receiver_floor + collet.core_seat_height, side: core bottom on the core-seat ledge (cut case)}, certifiers: ["S3 core_750|core_seat"]}
    - {pair: [core_seat, collet], kind: one_body, certifiers: ["declared: one body (the core-seat ledge is the collet bore bottom, collet.core_seat_height)", "S1 collet|core_seat C"], note: "1.3 (h) r2 (Topologist TP1.3-10 (a)): the seat and collet meet on a vertical edge only in the section; one body"}
    - {pair: [collet, receiver], kind: face, face: {z: receiver_floor, side: collet foot on the receiver floor (cut case)}, certifiers: ["S3 receiver|collet"], note: "1.3 (h) r2 (Topologist TP1.3-10 (a)): rerouted; collet|holder (cone opens under the cut load) and holder|receiver (radial fit) carry no cut-case axial load in the drawing"}
    - {pair: [receiver, base_plate], kind: face, certifiers: ["S3 base_plate|receiver"], note: "shoulder underside on the plate top (Design Notes 32); S1 base_plate|receiver C struck: S1 draws the plate without its hole (Loftsman 1.3 (c) P5L F1)"}
    - {pair: [base_plate, base_frame], kind: face_record, certifiers: ["S1 base_frame|base_plate C", "S2 base_plate|base_frame z-contact"], note: "not at x = 0 (Designer 1.3 (a) Correction 8)"}
    - {pair: [base_frame, frame_upper_c], kind: fastened, certifiers: ["S2 frame_upper_c|base_frame z-contact", "S3 base_frame|frame_upper_c"]}
    - {pair: [frame_upper_c, bracket_anchor_c], kind: fastened, certifiers: ["S2 bracket_anchor_c|frame_upper_c plan-contact", "S3 bracket_anchor_c|frame_upper_c"]}
    - {pair: [bracket_anchor_c, anchor_c], kind: fastened, certifiers: ["S2 bracket_anchor_c|anchor_c plan-contact (round r 21 block; S2 r9 re-certifies the 42 square)", "S3 anchor_c|bracket_anchor_c"]}
    - {pair: [anchor_c, anchor_bearing_c], kind: face, certifiers: ["S3 anchor_c|anchor_bearing_c"], face: "cover underside on the upper outer race, jackscrew.anchor_bearing_z + jackscrew.anchor_bearing_width (288), cut case", note: "lifting cases bear on the block shoulder 272"}
    - {pair: [anchor_bearing_c, anchor_locknut_c], kind: face, certifiers: ["S3 anchor_locknut_c|anchor_bearing_c"], face: "locknut top under the lower inner race, jackscrew.anchor_bearing_z - jackscrew.anchor_bearing_width (272), cut case", note: "Loftsman 1.3 (b) re-sign FIX 8: the cut-case path; the screw shoulder at 288 unloads in the cut case"}
    - {pair: [anchor_locknut_c, screw_c], kind: thread, certifiers: ["S3 anchor_locknut_c|screw_c"], face: "M10x1 thread", note: "Loftsman 1.3 (b) re-sign FIX 8"}
    - {pair: [screw_c, nut_c], kind: thread, certifiers: ["S3 screw_c|nut_c"], note: "tension segment (S3-1)"}
    - {pair: [nut_c, nut_housing_c], kind: face, certifiers: ["S3 nut_housing_c|nut_c"], face: "counterbore shoulder under the flange, nut_z + jackscrew.nut_length / 2 - jackscrew.nut_flange_thickness, cut case", note: "cut case: flange on the counterbore shoulder; lifting cases through nut_screws_c (head on the flange top)"}
    - {pair: [nut_housing_c, ring], kind: one_body, certifiers: ["S3 ring|nut_housing_c"]}
    - {pair: [ring, bearing], kind: declared, certifiers: ["declared (S6-5 draws the axial seat)"], note: "radial fit in the section; K7 certifiers dropped (Topologist R2-5)"}
    - {pair: [bearing, drill_tube], kind: declared, certifiers: ["declared (S6-5 draws the axial seat)"], note: "radial fit in the section; K7 certifiers dropped (Topologist R2-5)"}
    - {pair: [drill_tube, drill_head], kind: declared, certifiers: ["declared (S3 declares C; S6-5 draws it)"], note: "S1 drill_head|drill_tube undeclared F; S2 drill_tube|drill_head undeclared F (z-touch)"}
  a:
    - {pair: [drill_head, core_750], kind: declared, certifiers: ["declared: load application (the cut force acts between cutter and core; row load_cut, S3-1 reads it +Z)"], note: "K7 holds head and core N by design; no record can certify it C (Loftsman 1.3 (b) FIX 6 (b))"}
    - {pair: [core_750, core_seat], kind: face, face: {z: receiver_floor + collet.core_seat_height, side: core bottom on the core-seat ledge (cut case)}, certifiers: ["S3 core_750|core_seat"]}
    - {pair: [core_seat, collet], kind: one_body, certifiers: ["declared: one body (the core-seat ledge is the collet bore bottom, collet.core_seat_height)", "S1 collet|core_seat C"], note: "1.3 (h) r2 (Topologist TP1.3-10 (a)): the seat and collet meet on a vertical edge only in the section; one body"}
    - {pair: [collet, receiver], kind: face, face: {z: receiver_floor, side: collet foot on the receiver floor (cut case)}, certifiers: ["S3 receiver|collet"], note: "1.3 (h) r2 (Topologist TP1.3-10 (a)): rerouted; collet|holder (cone opens under the cut load) and holder|receiver (radial fit) carry no cut-case axial load in the drawing"}
    - {pair: [receiver, base_plate], kind: face, certifiers: ["S3 base_plate|receiver"], note: "shoulder underside on the plate top (Design Notes 32); S1 base_plate|receiver C struck: S1 draws the plate without its hole (Loftsman 1.3 (c) P5L F1)"}
    - {pair: [base_plate, frame_upper_a], kind: fastened, certifiers: ["S1 frame_upper_a|base_plate C", "S2 frame_upper_a|base_plate z-contact"]}
