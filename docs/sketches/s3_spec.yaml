# Rows (gameplan detail 1.0 spec format; S3 fields in the header comment). z_rule in z_A.
features:
- id: floor
  name: shop floor
  shape: shop floor line across the section width (u -340 to 340), ground hatch below
  kind: line
  axis: null
  projection: line
  keys: [jig.datum_a_above_floor, icd.footprint_x]
  z_rule: {z_min: shop_floor, z_max: shop_floor}
  depth: [-icd.footprint_x / 2, icd.footprint_x / 2]
  label: null
  neighbours: []
  sense: []
  chain: []
  moves: false
  axes: [section]
  section_class: reference
- id: base_frame
  name: base frame
  shape: '-Y and +Y rails cut across: 60 x 60 30-6060 sections with slot notches and the centre-bore lines, u -304 to -244 and 244 to 304, z_S 0 to 60 (shop floor to datum A); 5 outboard of the plate notch edges (Designer 1.3 (a) section 7)'
  kind: prism
  axis: null
  projection: rectangle
  keys: [icd.footprint_x, icd.footprint_y, profile.width, profile.height, frame.end_x, frame.support_x]
  z_rule: {z_min: shop_floor, z_max: 0}
  plan_poly:
  - - [-(icd.footprint_x / 2), icd.footprint_y / 2 - profile.width]
    - [icd.footprint_x / 2, icd.footprint_y / 2 - profile.width]
    - [icd.footprint_x / 2, icd.footprint_y / 2]
    - [-(icd.footprint_x / 2), icd.footprint_y / 2]
  - - [-(icd.footprint_x / 2), -(icd.footprint_y / 2)]
    - [icd.footprint_x / 2, -(icd.footprint_y / 2)]
    - [icd.footprint_x / 2, -(icd.footprint_y / 2 - profile.width)]
    - [-(icd.footprint_x / 2), -(icd.footprint_y / 2 - profile.width)]
  - - [frame.end_x - profile.width / 2, -(icd.footprint_y / 2 - profile.width)]
    - [frame.end_x + profile.width / 2, -(icd.footprint_y / 2 - profile.width)]
    - [frame.end_x + profile.width / 2, icd.footprint_y / 2 - profile.width]
    - [frame.end_x - profile.width / 2, icd.footprint_y / 2 - profile.width]
  - - [-(frame.end_x + profile.width / 2), -(icd.footprint_y / 2 - profile.width)]
    - [-(frame.end_x - profile.width / 2), -(icd.footprint_y / 2 - profile.width)]
    - [-(frame.end_x - profile.width / 2), icd.footprint_y / 2 - profile.width]
    - [-(frame.end_x + profile.width / 2), icd.footprint_y / 2 - profile.width]
  - - [frame.support_x - profile.width / 2, -(icd.footprint_y / 2 - profile.width)]
    - [frame.support_x + profile.width / 2, -(icd.footprint_y / 2 - profile.width)]
    - [frame.support_x + profile.width / 2, icd.footprint_y / 2 - profile.width]
    - [frame.support_x - profile.width / 2, icd.footprint_y / 2 - profile.width]
  - - [-(frame.support_x + profile.width / 2), -(icd.footprint_y / 2 - profile.width)]
    - [-(frame.support_x - profile.width / 2), -(icd.footprint_y / 2 - profile.width)]
    - [-(frame.support_x - profile.width / 2), icd.footprint_y / 2 - profile.width]
    - [-(frame.support_x + profile.width / 2), icd.footprint_y / 2 - profile.width]
  neighbours:
  - {id: frame_upper_c, class: C, source: member c foot on the -Y rail top (z_A 0) inside base.column_notch (Design Notes 27); S3 certifies it in section (S3-3)}
  - {id: base_plate, class: F, source: 'contact off the plane (rails beyond the notch, supports): at x = 0 the plate stops 5 inboard of each rail; certified by S1/S2 (Designer 1.3 (a) Correction 8; Loftsman 1.3 (b) FIX 5)'}
  sense: []
  chain: [axial]
  moves: false
  notes: ['plan_poly as s2_spec.yaml (X1); the section draws the rails only (end members and supports at x +-232, +-112 lie off the plane, figure note)']
  axes: [section]
  section_class: cut
  section_u:
  - [-(icd.footprint_y / 2), -(icd.footprint_y / 2 - profile.width), shop_floor, 0]
  - [icd.footprint_y / 2 - profile.width, icd.footprint_y / 2, shop_floor, 0]
  hatch: extrusion
- id: base_plate
  name: base plate
  shape: base plate cut, 12 thick, u -239 to 239 (the column notches remove it beyond |y| 239 at |x| <= 35), spigot-hole gap +-80.2; aluminium hatch (Designer 1.3 (a) section 7)
  kind: plate
  axis: null
  projection: rectangle
  keys: [icd.footprint_x, icd.footprint_y, base.plate_thickness, base.column_notch, base.column_notch_x, base.spigot_hole_dia]
  z_rule: {z_min: 0, z_max: base.plate_thickness}
  plan_poly:
  - - [-(icd.footprint_x / 2), '-(icd.footprint_y / 2 - base.column_notch[1])']
    - [icd.footprint_x / 2, '-(icd.footprint_y / 2 - base.column_notch[1])']
    - [icd.footprint_x / 2, 'icd.footprint_y / 2 - base.column_notch[1]']
    - [-(icd.footprint_x / 2), 'icd.footprint_y / 2 - base.column_notch[1]']
  - - [-(icd.footprint_x / 2), 'icd.footprint_y / 2 - base.column_notch[1]']
    - [-base.column_notch_x, 'icd.footprint_y / 2 - base.column_notch[1]']
