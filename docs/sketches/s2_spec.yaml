      - {strip: {from: ["guide.radius * cosd(guide.angle[0])", "guide.radius * sind(guide.angle[0])"], to: ["frame_upper.radius * cosd(jackscrew.angle[0])", "frame_upper.radius * sind(jackscrew.angle[0])"], back: "profile.width / 2", stop_at: ["(frame_upper.radius - profile.width / 2) * cosd(jackscrew.angle[0]) + profile.width / 2 * sind(jackscrew.angle[0])", "(frame_upper.radius - profile.width / 2) * sind(jackscrew.angle[0]) - profile.width / 2 * cosd(jackscrew.angle[0])"], half_width: "profile.width / 2"}}
