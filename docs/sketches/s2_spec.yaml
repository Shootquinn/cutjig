# S2 spec, plan XY (contributor gameplan (sean) detail 1.2, lines 243-261).
status: "signed (Designer, Loftsman 1.2 (b), with re-check sections; step1.2_designer_spec_signoff.md, step1.2_loftsman_spec_signoff.md); 1.2 (c) gear section field added for the plan annulus (signed at (c) by the Loftsman, Designer, Topologist and Software Engineer after P5f); 1.2 (h) r2 edits (gear ticks and shape text, label_theta, reference rows, F6 label text, pinion|gear_hub G 3, S2-5b over moves: true) awaiting the Designer re-sign and the raisers' re-check (step1.2_engineer_revision_r2.md)"
# Written at 1.2 (b) by The Engineer, 2026-11-25, from research/sean/cr_scratch/step1.2_designer_params_review.md and Sean's
# STOP S2-A rulings (gameplan Design Notes 27): frame_upper.radius 274 with member c on the rail top in base.column_notch;
# O1-B (pinion phase 60, S2-5 split into S2-5a and S2-5b); one descent-stop pad. No drawing before the signed spec.
# Letter map (S1 ids kept for every shared row): screw set a = jackscrew.angle[1] 150, b = angle[0] 30, c = angle[2] 270;
# pinion set a = pinion.angle[1] 210, b = angle[2] 330, c = angle[0] 90; guide rod guide_member = guide.angle[0] 0,
# guide_member_b = angle[1] 180; lugs and bushings a = angle[0], b = angle[1]; tie a: rod 0 to member b (30), tie b: rod
# 180 to member a (150).
# axis X on a radial-axis row (pinion, NEMA 23, shaft) means radial, as in S1; in plan these rows are rectangles or
# trapezoids along the radial direction at their azimuth (TP-13 plan rule, 1.2 (c)).
# New row fields at 1.2 (b), evaluated by check_stack.evaluate_spec: plan_poly (convex plan pieces as [x, y] expression
# points, or a strip from a point to a point with a half-width) and sector (apex on the axis, theta, half_angle, r).
# draw (sightline_f6) is drawing data for s2_plan.py. outboard with frame: radial compares the radial distance of the
# centroids (plan form for (c); the S1 form reads x cos(theta)).
sketch: s2
script: s2_plan.py
view: plan_xy
z_rule_frame: z_A
plot_frame: z_S
plan_figure: {name: s2_plan, pose: load, note: "one plan figure (PNG s2_plan_r<k>.png); z bands per pose for the plan K7 and the swept case; the moving parts' plan positions do not change with pose", figure_note: "Not drawn: wing nut, collet, holder (below the drill path, S1); power-off hold device (Step 2); LM20UU bushing (inside housing and lug); descent-stop pads at 30 and 270 (one pad, Design Notes 27)"}
# figure_note (detail 1 common (b), second clause; Designer 1.2 (b) FIX 3): s2_plan.py prints it on the figure; it names
# every not_drawn part. At 1.2 (c) K4 (or a label check) verifies the drawn text against not_drawn, with Z and B.
question: >-
  Does it fit, stay coaxial, and leave the operator a side to load the core and change collets?
closes:
  R: [R9, R13, R16]
  design_notes: ["Design Notes 2: the frame's role under a ring on three screws (layout part)"]
  other: ["operator access: loading sector theta 90 +- 45, F6 sightline"]
  carries_assumed: [Q2]
k7_tolerance: "G passes at distance >= g_min - 0.05 mm; C at distance <= 0.05 mm and overlap <= 0.01 mm2; F at overlap <= 0.01 mm2 (sketch_common TOL_C, TOL_AREA; LF-9). Plan view: the separating band is the z band per pose (sketch_common._sep_band); disjoint z bands settle F only, a G pair passes on max(z gap, plan distance) >= g_min - 0.05 (LF-1 rule with z for depth); every place footprint contains its part (K8 projected_extent, x and y). A neighbour with poses declares the pair at those poses only."

# Stack fields as S1 (the plan z bands use the S1 pose stack; one rule, Design Notes 22, 23).
q9_length_keys: [core.length_capture, core.length_install]
always_loaded: [core.length_install]
q9_options:
  "0.5 m only": [core.length_capture]
  "0.5 and 0.75 m": [core.length_capture, core.length_install]
  "plus 1 m": [core.length_capture, core.length_install, core.length_optional]
capture_core_length: core.length_install
load_plane: {term: core_stop, feature: core_seat, edge: z_max, offset: 0}
entry_plane: {term: collar_top, feature: collar, edge: z_max, offset: 0}
symbols:
  c: {domain: [0, null], unit: mm, owner: "Sean (N11)", source: "Design Notes 23 (FIX 5 ruling); as s1_spec.yaml symbols.c", status: "no value; reported as an expression"}
park_rule:
  stop_k: "max(stop.height_z, collet.core_stop_z + L + stop.g_stop - drill.bore_ceiling_above_tip, collet.core_stop_z + L + c - upper.travel_max)"
  start_k: "stop_k + upper.travel_max"
  park: "max(max_k start_k, entry_plane + max L) + upper.load_clearance"
  for_step4: "as s1_spec.yaml park_rule.for_step4"
undeclared_pairs: F
poses:
  - id: load
    tip_z: park_tip
    vars: {capture_core_bottom: "collet.core_stop_z + 0.5 * (stop.collar_top_z - collet.core_stop_z)"}
    purpose: "operator loads a core and changes a collet in the operator sector under the held ring (S2-5a, S2-5b)"
  - id: start
    tip_z: "stop.start_z[0]"
    vars: {capture_core_bottom: core_stop}
    purpose: "top of the 650 mm travel (z band for the swept case)"
  - id: capture_end
    tip_z: "stop.height_z"
    vars: {capture_core_bottom: core_stop}
    purpose: "lowest ring position: ring rim on the descent-stop pad; F6 sightline"
  - id: park
    tip_z: park_tip
    purpose: "top of the lift stroke (z band for the swept case)"

# S2 checks (gameplan detail 1.2 table; Design Notes 27): read by checks_s2.py.
s2_checks:
  S2-1: {screws: [screw_a, screw_b, screw_c], pinions: [pinion_a, pinion_b, pinion_c], spacing_deg: 120, phase_deg: 60, tol_deg: 0.1, source: "[DN23], [CP §15]; phase Designer 1.2 (a) section 4, Design Notes 27"}
  S2-2: {screws: [screw_a, screw_b, screw_c], expr: "jackscrew.pitch_radius - jackscrew.nut_flange_od / 2 - icd.keepout_radius", g_min: 10, source: "keep-out DERIVED; 10 mm ASSUMED"}
  S2-3: {pinions: [pinion_a, pinion_b, pinion_c], gear: gear, pitch_r: "gear.pitch_diameter / 2", tol: 0.05, source: "overlay gear.* ASSUMED"}
  S2-4: {rows: [drill_tube, collet_axis, ring, gear], tol: 0.05, source: "R13 ASSUMED [CP §14]; nominal only"}
  S2-5a: {sector: operator_sector, against: fixed, fixed: [frame_upper_a, frame_upper_b, frame_upper_c, liftmotor_a, liftmotor_b, liftmotor_c, anchor_a, anchor_b, anchor_c, guide_a, guide_b, guide_c, bracket_anchor_a, bracket_anchor_b, bracket_anchor_c, bracket_guide_a, bracket_guide_b, bracket_guide_c, descent_stop_post, guide_member, guide_member_b, guide_tie_a, guide_tie_b, screw_a, screw_b, screw_c, descent_stop], class: F, z: all, source: "Designer 1.2 (a) section 5; Design Notes 27 O1-B"}
  S2-5b: {sector: operator_sector, pose: load, parts: moves, band: operator.hand_band, g_min: 10, source: "premise of the S2-5a relief (detail 1 common (h)); Designer 1.2 (a) section 5 raises and signs; Design Notes 27 O1-B; parts: every row with moves: true, not reference, not a line kind (Topologist 1.2 (e) FIX TP1.2-3)"}
  S2-6: {seats: {frame_upper_a: base_plate, frame_upper_b: base_plate, frame_upper_c: base_frame}, notch_clear: 5, tol: 0.05, source: "Designer 1.2 (a) section 10 (proposed S2-6); gameplan l.258; params base.*, overlay frame_upper.foot"}

rubric_additions:
  - "plan handedness: +X along slot line C (y +259, +Y rail), theta counter-clockwise from +X seen from +Z; screws at 30, 150, 270 and pinions at 90, 210, 330 (K8 axes not inverted, azimuth predicates; S2-1)"
  - "all three screw sets, pinions, NEMA 23s, lift motors and frame members drawn (S2-f; K9)"
  - "on every pinion axis the motor is outboard and the pinion inboard, narrowing toward the axis (K8 outboard radial, taper inward)"
  - "the ring reads as a structure with housings, mounts and lugs, not a washer (visual only, V7)"
  - "member c stands on the rail top inside the column notch with the notch outline visible round it (S2-6)"
reported:
  - "outline extents (every drawn part, all poses) against the 644 x 608 footprint (open, not asserted)"
  - "members against the plate edge: outer face radius + 30 against 304 (theta 270) and the x extent of members a, b against 322"
  - "footprint against the S1 unbolted tip force (bolt-down or footprint goes to the Step 2 row, R1)"
  - "cutter overhang of the keep-out: drill.head_od / 2 - icd.keepout_radius = 2.70 (S2-a; Step 4 ICD row icd.keepout_radius)"
  - "F6 eye limits at r 400: 0.49 m z_S to the axis, 0.58 m z_S to the cutter rim (Designer 1.2 (a) section 6)"
  - "S2-5b overhead strike list in the sector at load (bearing, ring, pinion, motor, gear z bands) and the drill tip above the hand band"
  - "tight spots with their basis: ring rim to guide rod 10.00 (identity), ring rim to member 34.00, lift motors to the sector edge 11.71 (bound, circumscribed outline) / 15.69 (drawn square), pinion toe to gear hub 5.22 (Loftsman 1.2 (e) LF1.2-2, -4)"
  - "highest point and outline extents over parts only: rows with reference: true (operator_sector, sightline_f6, collet_axis, keepout) are excluded (Designer M1 r1 ruling 3; Loftsman LF1.2-5)"
descent_stop: "one pad (frame_upper.stop_pad_count 1; Sean STOP S2-A, Design Notes 27): rows descent_stop and descent_stop_post at jackscrew.angle[1], as S1"

not_drawn:
  - {part: "wing nut", reason: "below the drill path, drawn in S1 (side view); not a plan item (Designer 1.2 (a) section 8)"}
  - {part: "collet", reason: "below the drill path, drawn in S1; datum B (row collet_axis) marks its axis (Designer 1.2 (a) section 8)"}
  - {part: "holder", reason: "below the drill path, drawn in S1 (Designer 1.2 (a) section 8)"}
  - {part: "power-off hold device", reason: "Step 2 decides (N7, T2-c); none drawn in S1 either"}
  - {part: "descent-stop pads at jackscrew.angle[0] and [2]", reason: "declined by Sean (STOP S2-A, Design Notes 27): one pad"}
  - {part: "LM20UU bushing (OD 32 x 42)", reason: "inside the housing (rows guide_bushing_a, _b) and the lug; concealed in plan by both; keys guide.bushing_od, guide.bushing_length on the housing rows (Designer 1.2 (b) FIX 2)"}

