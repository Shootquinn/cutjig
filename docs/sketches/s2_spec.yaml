# Row fields per gameplan l.130-131. z_rule in z_A (check_stack converts to z_S once).
features:
  - id: base_plate
    name: "base plate"
    shape: "aluminium base plate 644 x 608 x 12 seen from above: rectangle with the receiver spigot hole 160.4 at the centre (row base_spigot_hole), a 70 x 65 column notch at x 0 on each long edge, slotted fastener holes along both long edges (row base_slots); underside key and pin pockets dashed (rows base_key_pockets, base_pin_pocket)"
    kind: plate
    axis: null
    projection: rectangle
    keys: [icd.footprint_x, icd.footprint_y, base.plate_thickness, base.column_notch, base.column_notch_x]
    z_rule: {z_min: 0, z_max: base.plate_thickness}
    plan_poly:
      - [["-(icd.footprint_x / 2)", "-(icd.footprint_y / 2 - base.column_notch[1])"], ["icd.footprint_x / 2", "-(icd.footprint_y / 2 - base.column_notch[1])"], ["icd.footprint_x / 2", "icd.footprint_y / 2 - base.column_notch[1]"], ["-(icd.footprint_x / 2)", "icd.footprint_y / 2 - base.column_notch[1]"]]
      - [["-(icd.footprint_x / 2)", "icd.footprint_y / 2 - base.column_notch[1]"], ["-base.column_notch_x", "icd.footprint_y / 2 - base.column_notch[1]"], ["-base.column_notch_x", "icd.footprint_y / 2"], ["-(icd.footprint_x / 2)", "icd.footprint_y / 2"]]
      - [[base.column_notch_x, "icd.footprint_y / 2 - base.column_notch[1]"], ["icd.footprint_x / 2", "icd.footprint_y / 2 - base.column_notch[1]"], ["icd.footprint_x / 2", "icd.footprint_y / 2"], [base.column_notch_x, "icd.footprint_y / 2"]]
      - [["-(icd.footprint_x / 2)", "-(icd.footprint_y / 2)"], ["-base.column_notch_x", "-(icd.footprint_y / 2)"], ["-base.column_notch_x", "-(icd.footprint_y / 2 - base.column_notch[1])"], ["-(icd.footprint_x / 2)", "-(icd.footprint_y / 2 - base.column_notch[1])"]]
      - [[base.column_notch_x, "-(icd.footprint_y / 2)"], ["icd.footprint_x / 2", "-(icd.footprint_y / 2)"], ["icd.footprint_x / 2", "-(icd.footprint_y / 2 - base.column_notch[1])"], [base.column_notch_x, "-(icd.footprint_y / 2 - base.column_notch[1])"]]
    label: {text: "base plate (open), x", key: icd.footprint_x, fmt: ".0f"}
    neighbours:
      - {id: base_frame, class: C, g_min: 0, source: "icd.datum_a: frame top plane = plate underside (S1 base_frame|base_plate)"}
    sense: []
    chain: [axial]
    moves: false
    notes:
      - "plan_poly: the plate less both column notches as five convex pieces (centre y +-239, four edge strips x +-35 to +-322, y +-239 to +-304); the notch outline is the boundary between the pieces (Designer shape frame_upper_c)"

  - id: base_frame
    name: "base frame"
    shape: "30-6060 base frame under the plate, dashed: two rails along X at y +-274, end members at x +-232, plate supports at x +-112"
    kind: prism
    axis: null
    projection: rectangle
    keys: [icd.footprint_x, icd.footprint_y, profile.width, profile.height, frame.end_x, frame.support_x]
    z_rule: {z_min: shop_floor, z_max: 0}
    plan_poly:
      - [["-(icd.footprint_x / 2)", "icd.footprint_y / 2 - profile.width"], ["icd.footprint_x / 2", "icd.footprint_y / 2 - profile.width"], ["icd.footprint_x / 2", "icd.footprint_y / 2"], ["-(icd.footprint_x / 2)", "icd.footprint_y / 2"]]
      - [["-(icd.footprint_x / 2)", "-(icd.footprint_y / 2)"], ["icd.footprint_x / 2", "-(icd.footprint_y / 2)"], ["icd.footprint_x / 2", "-(icd.footprint_y / 2 - profile.width)"], ["-(icd.footprint_x / 2)", "-(icd.footprint_y / 2 - profile.width)"]]
      - [["frame.end_x - profile.width / 2", "-(icd.footprint_y / 2 - profile.width)"], ["frame.end_x + profile.width / 2", "-(icd.footprint_y / 2 - profile.width)"], ["frame.end_x + profile.width / 2", "icd.footprint_y / 2 - profile.width"], ["frame.end_x - profile.width / 2", "icd.footprint_y / 2 - profile.width"]]
      - [["-(frame.end_x + profile.width / 2)", "-(icd.footprint_y / 2 - profile.width)"], ["-(frame.end_x - profile.width / 2)", "-(icd.footprint_y / 2 - profile.width)"], ["-(frame.end_x - profile.width / 2)", "icd.footprint_y / 2 - profile.width"], ["-(frame.end_x + profile.width / 2)", "icd.footprint_y / 2 - profile.width"]]
      - [["frame.support_x - profile.width / 2", "-(icd.footprint_y / 2 - profile.width)"], ["frame.support_x + profile.width / 2", "-(icd.footprint_y / 2 - profile.width)"], ["frame.support_x + profile.width / 2", "icd.footprint_y / 2 - profile.width"], ["frame.support_x - profile.width / 2", "icd.footprint_y / 2 - profile.width"]]
      - [["-(frame.support_x + profile.width / 2)", "-(icd.footprint_y / 2 - profile.width)"], ["-(frame.support_x - profile.width / 2)", "-(icd.footprint_y / 2 - profile.width)"], ["-(frame.support_x - profile.width / 2)", "icd.footprint_y / 2 - profile.width"], ["-(frame.support_x + profile.width / 2)", "icd.footprint_y / 2 - profile.width"]]
    neighbours: []
    sense: []
    chain: [axial]
    moves: false
    notes:
      - "rail centre y = icd.footprint_y / 2 - profile.width / 2 = 274 (DERIVED, spec expression, no key; Designer 1.2 (a) row 2); rails run the full footprint_x (644), end members and supports between the rails (488)"

  - id: base_spigot_hole
    name: "receiver spigot hole"
    shape: "receiver spigot hole d 160.4 in the plate, circle at the origin"
    kind: line
    axis: null
    projection: circle
    keys: [base.spigot_hole_dia, base.plate_thickness]
