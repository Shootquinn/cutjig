    axis: null
    projection: rectangle
    keys: [guide.top_support, guide.radius, guide.angle, guide.length, frame_upper.radius, jackscrew.angle, jackscrew.top_guide_z, jackscrew.pitch_radius, jackscrew.nut_flange_od, profile.width, profile.height]
