    # Designer 1.2 (b) FIX 1, mirror of tie a in x: K = member centre - (w/2) r_hat + (w/2) t_hat at jackscrew.angle[1]
    # = (-226.31, 96.02), station 95.69
    plan_poly:
      - {strip: {from: ["guide.radius * cosd(guide.angle[1])", "guide.radius * sind(guide.angle[1])"], to: ["frame_upper.radius * cosd(jackscrew.angle[1])", "frame_upper.radius * sind(jackscrew.angle[1])"], back: "profile.width / 2", stop_at: ["(frame_upper.radius - profile.width / 2) * cosd(jackscrew.angle[1]) - profile.width / 2 * sind(jackscrew.angle[1])", "(frame_upper.radius - profile.width / 2) * sind(jackscrew.angle[1]) + profile.width / 2 * cosd(jackscrew.angle[1])"], half_width: "profile.width / 2"}}
    neighbours:
      - {id: guide_member_b, class: "N", source: "rod top in a bore in the tie, 1165 to 1212 (guide.top_support; Designer 1.2 (b) FIX 1)"}
      - {id: bracket_guide_a, class: C, g_min: 0, source: "tie bottom on the arm top at 1165, bolted (guide.top_support; Designer 1.2 (b) FIX 1); plan overlap with z contact, plan C rule at 1.2 (c)"}
      - {id: frame_upper_a, class: C, g_min: 0, source: "tie end at the member corner K (point contact, plan distance 0.00, overlap 0; Designer 1.2 (b) FIX 1)"}
    sense: []
    chain: [torque]
    moves: false
    notes:
      - "z 1165 to 1225 (on the arm top, top flush with the member top); strip from rod centre - 30 u to the member near corner station 95.69; Step 2 decides the tie (guide.top_support ASSUMED)"

