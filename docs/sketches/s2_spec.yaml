    # Designer 1.2 (b) FIX 1: axis u = unit(member centre - rod centre); start 30 behind the rod centre; end at the station
    # of the member's near corner K = member centre - (w/2) r_hat - (w/2) t_hat at jackscrew.angle[0] = (226.31, 96.02),
