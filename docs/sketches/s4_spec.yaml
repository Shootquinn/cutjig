# S4 spec, section B-B through the base on the drill axis (contributor gameplan (sean) detail 1.4).
# Written at 1.4 (b) by The Engineer, 2026-11-27, from research/sean/cr_scratch/step1.4_designer_params_review.md and
# Sean's STOP S4-A rulings (gameplan Design Notes 34): section_yz (the S3 plane); the kept 32 mm collet, no key moved;
# holder in true section in S1 r9 and S3 r8, X1 compares the true section; S4-c fits; S4-d bore-vertical predicate;
# advance D (the lift lowers the drill one slice per cut, the core stays on the stop) with the 160 mm nylon carrier C
# drawn; S4-2 as short-core exposure and grip on the drawn configuration; cast-on liner in a second figure.
# No drawing before the signed spec. Report: research/sean/cr_scratch/step1.4_engineer_spec.md.
#
# Shared rows (receiver, collet, core_seat, holder, wingnut, collar, base_plate, drill_head, floor): place, z_rule and
# plan_poly are copied from s3_spec.yaml (= s1_spec.yaml) unchanged, so X1 passes today. The S4-b z_rule edits (holder
# z_max to the tube top, collar z_min to the ring underside) and the S1 stack-tie offset are X1 fields shared with S1 and
# S3: they are listed in `x1_edits_at_p6` and applied to s1, s3 and s4 together at P6 (S1 r9, S3 r8), when the scripts
# draw the true sections. S1/S3 r8-era `section` fields are copied as they stand; `section_true` carries the true section.
#
# New spec fields at 1.4 (b) (declared here; check_stack ignores them today; K3 to K9 and X1 read them from P4 (c)):
#   section_true: the true section of a round row in the plane, named pieces, mirrored about u = 0 (axis-Z rows):
#     a rectangle [r_in, r_out, z_lo, z_hi], or {poly: [[r, z], ...]} a convex polygon (counter-clockwise in (r, z));
#     z in z_A stack names. Supersedes `section` for drawing, K5, K7 and K8 on the row at P4; X1 compares it at P4 on
#     every shared row (Sean STOP S4-A: "X1 compares section"). Drafting conventions: mated threads drawn at the
#     receiver major cylinder (thread.major / 2); the collet bore lip radius (collet.bore_lip_radius 1.0) and the
#     receiver register chamfer and thread lead-in are drawn as straight chamfers.
#   piece / of_piece on a sense predicate: the predicate reads the named section_true piece(s) only.
#   new predicate kinds: vertical_edge (S4-d), between (washer), seat_piece on rests_on (collet foot on the floor top).
#   poses carrier and liner: two figures at one drill pose (tip at stop.height_z); rows carry `poses` (K9 pose set).
#   section_figures: one figure per pose; section_figure (the carrier figure) keeps the S3 single-figure readers.
#   x1_edits_at_p6: the shared-row X1 field edits, applied to every listed spec in one save point at P6.
status: "draft for sign-off at 1.4 (b): The Designer (part list) P3a, The Loftsman P3b. Written 2026-11-27 (P2)."
sketch: s4
script: s4_base_section.py        # K1 scans this file at 1.4 (d)
view: section_yz
section:
  id: B-B
  plane: "x = 0 (YZ plane through the drill axis), the S3 plane (Designer 1.4 (a) section 1; Sean STOP S4-A)"
  look: "from +X toward -X"
  axes: {u: "+Y, right", z: "+Z, up (z_S plotted)", toward_viewer: "+X"}
  handedness: "u x z = toward viewer: Y x Z = X (right-handed); u equals plan y"
  convention: {cut: "hatched, one pattern per material, legend in the figure note", unsectioned: "core_100, carrier, drill head (outline over the hatch around them, ASME Y14.3)", beyond: "within 0 > x >= -profile.width, elevation, edges behind a cut part dashed; the -X wing of the wing nut lies at x -83.14 to -115, past the band (open item for the Topologist at (c): beyond_depth or not_drawn)", omitted: "in front (x > 0) and past the beyond band: not drawn, listed in the figure note"}
  source: "Designer 1.4 (a) section 1; Sean STOP S4-A, Design Notes 34 (section_yz; S3 machinery)"
  hatch_alt: {aluminium: "||"}
crop: {u: [-130, 130], z_A: [-60, 330], source: "Designer 1.4 (a) section 10: floor to about 330, u +-130 with plate break lines; base-frame rails (|u| 244 to 304) outside the crop"}
section_figure: {name: s4_base_section, pose: carrier, png: "s4_base_section_r<k>.png", note: "figure 1: the base stack at K d+1 with the d 100 collet, the 160 carrier and the 100 mm core; drill at the stop (tip stop.height_z)"}
section_figures:
  - {name: s4_base_section, pose: carrier, png: "s4_base_section_r<k>.png"}
  - {name: s4_liner_section, pose: liner, png: "s4_liner_section_r<k>.png", note: "figure 2: cast-on liner OD 106 x 2.50 (K d+1) gripped by the d 105 collet, carrier d 101 inside, the same 100 mm core (Sean STOP S4-A 'Cast-on liner', second figure)"}
z_rule_frame: z_A
plot_frame: z_S
question: >-
  How is a core advanced through the kept base for each slice, and does the kept collet family cover a 100 mm tall
  core with the core gripped and exposed above the nut plate?
closes:
  R: [R10, R11, R12]
  Q: [Q4, Q5, Q6, Q10]
  rulings: ["R11 read as relative advance: the core stays on the stop and the lift lowers the drill one slice per cut (Sean STOP S4-A, Design Notes 34)", "Q5: kept 32 mm collet, no key moves; long support by the liner (Design Notes 34)", "Q6: cast-on liner, D = d + 5 (Design Notes 34)"]
  carries_assumed: [B3-1, B3-2, B3-3, B3-4]
k7_tolerance: "as s3_spec.yaml: G passes at distance >= g_min - 0.05 mm; C at distance <= 0.05 mm and overlap <= 0.01 mm2; F at overlap <= 0.01 mm2; section view depth bands along X settle F only; C fails when the band gap exceeds 0.05"

load_plane: {term: core_stop, feature: core_seat, edge: z_max, offset: 0}
entry_plane: {term: collar_top, feature: collar, edge: z_max, offset: 0}
stack_ties:
  - {id: holder_flange, term: collar_top, feature: holder, edge: z_max, offset: "nut.plate_thickness + washer.thickness - nut.washer_pocket_depth + collar.top_above_plate", source: "as s1_spec.yaml (Loftsman 1.1 (e) LF1.1-1; test_P18 stack); offset becomes collar.thickness at P6 with the holder z_max (x1_edits_at_p6 item 3)"}
undeclared_pairs: F
poses:
  - id: carrier
    tip_z: "stop.height_z"
    purpose: "figure 1: drill at the stop (tip 184.84 z_A), base stack at K d+1, d 100 collet, carrier 160 on the core seat, 100 mm core bonded on the carrier"
  - id: liner
    tip_z: "stop.height_z"
    purpose: "figure 2: as carrier with the cast-on liner OD 106 in the d 105 collet"

# x1_edits_at_p6: shared-row X1 fields that S4-b changes (Sean STOP S4-A, scope (i)). Applied at P6 to every spec named,
# in one save point, with S1 r9 and S3 r8 drawn the same session. Until then every spec carries the old value (X1 pass).
x1_edits_at_p6:
  - {item: 1, row: holder, field: z_rule.z_max, specs: [s1, s3, s4], old: "holder_bottom + holder.length + holder.flange_thickness", new: "holder_bottom + holder.length + holder.flange_thickness + washer.thickness - nut.washer_pocket_depth + nut.plate_thickness + nut.lift_play", value_old: 145.09, value_new: 153.84, source: "build_parts/holder.py dims() z_top: the tube runs through the nut plate to the collar underside (Designer 1.4 (a) section 2, Correction 4)"}
  - {item: 2, row: collar, field: z_rule.z_min, specs: [s1, s3, s4], old: "collar_top - collar.top_above_plate", new: "collar_top - collar.thickness", value_old: 153.09, value_new: 153.84, source: "holder.py collar ring z_top to z_top + collar.thickness; 153.09 to 153.84 is nut.lift_play (Designer Correction 4)"}
  - {item: 3, row: holder, field: stack_ties.holder_flange.offset, specs: [s1, s4], old: "nut.plate_thickness + washer.thickness - nut.washer_pocket_depth + collar.top_above_plate", new: "collar.thickness", source: "the tie follows the holder z_max (item 1); holder z_max + collar.thickness = collar_top 159.84 (test_P18 stack: 8 = nut.plate_thickness + washer proud, collar.top_above_plate = nut.lift_play + collar.thickness)"}

# S4 checks (gameplan detail 1.4 table as ruled; read by checks_s4.py).
s4_checks:
  S4-1:
    formula: "seat.holder_bottom_R - (holder.stroke_gap_R - witness.zone_high) + holder.length + holder.flange_thickness + 8 + collar.top_above_plate + icd.floor_above_datum_a"
    function: check_stack.collar_top_z_A
    against: stop.collar_top_z
    tol: 0.01
    drawn: {row: collar, edge: z_max, tol: 0.05, read: "drawn collar z_max (z_S) converted to z_A equals the formula (K6 holds every other height)"}
    rule: "tests/test_params_bom.py l.694-702 (test_P18_collar_top_recomputed_from_params): the collar top recomputed from params equals stop.collar_top_z 159.84 within 0.01; the drawn collar top follows within 0.05"
    source: "stop.collar_top_z DERIVED; gameplan detail 1.4 S4-1"
  S4-2:
    form: short_core_exposure_and_grip      # Sean STOP S4-A, Design Notes 34: S4-2 rewritten for advance D with carrier C drawn
    poses:
      carrier: {core: core_100, carrier: carrier, seat: core_seat, grip_member: carrier, collet: collet, grip_band: ["collet.core_stop_z", "receiver_floor + collet.slit_length + collet.slit_ligament + collet.relief_hole_dia / 2 - min(receiver.register_bore_radius - fit.seat_clearance - collet.foot_ring_width - (collet.slit_length + collet.slit_ligament + collet.relief_hole_dia / 2 - holder.bottom_above_floor_Kmax) * sind(cone.alpha) / cosd(cone.alpha) - (core.diameter_nominal + core.tol + collet.c_i) / 2 - collet.min_wall, collet.chamfer_cap)"]}
      liner: {core: core_100, carrier: carrier, seat: core_seat_105, grip_member: liner, collet: collet_105, grip_band: ["collet.core_stop_z", "receiver_floor + collet.slit_length + collet.slit_ligament + collet.relief_hole_dia / 2 - min(receiver.register_bore_radius - fit.seat_clearance - collet.foot_ring_width - (collet.slit_length + collet.slit_ligament + collet.relief_hole_dia / 2 - holder.bottom_above_floor_Kmax) * sind(cone.alpha) / cosd(cone.alpha) - (liner.collet_d + core.tol + collet.c_i) / 2 - collet.min_wall, collet.chamfer_cap)"]}
    exposure: {datum_row: wingnut, datum_edge: z_max, min: core.min_exposed, read: "drawn core_100 z_max minus the drawn wing-nut (nut-plate) top, z_A, against core.min_exposed"}
    rule: "(a) the core rests on the carrier and the carrier rests on the core seat, each within 0.05 (drawn bottom minus seat top); (b) drawn core top minus the nut-plate top >= core.min_exposed (143.12); (c) the grip member's drawn z extent covers the collet straight bore grip_band (42.50 to 65.70 at d 100; 42.50 to 68.20 at d 105). Asserted on the drawn configuration only (Designer 1.4 (a) section 6); core.min_exposed is DERIVED from DECLARED stop.g_stop, not a soft key"
    expected: {carrier: {exposure: 149.41, margin: 6.29, grip_band: [42.5, 65.7]}, liner: {exposure: 149.41, margin: 6.29, grip_band: [42.5, 68.2]}}
    b_forms: ["B1 carrier deleted: core on the core seat, exposure -10.59, (a) and (b) fire", "B2 carrier.length 150: exposure 139.41, (b) fires", "B3 carrier bottom drawn at 66.00: (a) and (c) fire"]
    source: "[CP §9, Q4]; Sean STOP S4-A, Design Notes 34; Designer 1.4 (a) section 6 (S4-2 form for D + C)"
  S4-3:
    rows: [collet, collet_105, holder, wingnut, washer, receiver, core_100, carrier, collar, liner]
    rule: "the K8 sense predicates of the listed rows (field sense), evaluated in the section Axes at each pose where the row is drawn; any issue fails S4-3 (ASSEMBLY.md; critical-path 7.1 backcap failure)"
    b_forms: ["collet flipped end for end (foot ring at the top, cone widening upward)", "washer drawn above the nut plate", "wing nut drawn below the holder flange", "collet bore drawn parallel to the outer cone (S4-d)"]
    source: "ASSEMBLY.md; critical-path 7.1; Designer 1.4 (a) section 12; S4-d adopted (Design Notes 34)"

rubric_additions:
  - "V3 (S4): the collet foot ring is at the bottom on the receiver floor and its outer cone narrows upward; the holder cone narrows upward on it (K8 taper, piece cone)"
  - "V3 (S4): the wing nut sits above the PTFE washer, which sits on the holder flange (K8 between, clears_above)"
  - "V3 (S4): the 100 mm core and the carrier stand upright, chamfer mark at the core top, the core top above the minimum-exposure line (S4-2)"
  - "V7 (S4): the two slit ticks show one top-open slit (u > 0) and one bottom-open slit (u < 0); the receiver thread reads by its root lines (collet:slits, receiver:root)"
  - "V10 (S4): the operator rows of Designer 1.4 (a) section 11 (set a short core, advance by the lift, take the slice off at park, change a collet) (visual-only)"
  - "section handedness: viewer at +X, u = +Y right; the u > 0 slit tick is the theta 112 slit (behind the plane), the u < 0 tick theta 262 (K8 side on the sub-artist)"

