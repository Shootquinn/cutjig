# Rows. z_rule in z_A. TAN below stands for sind(cone.alpha) / cosd(cone.alpha), written out in every expression.
features:
- id: floor
  name: shop floor
  shape: shop floor line across the crop (u -130 to 130), ground hatch below
  kind: line
  axis: null
  projection: line
  keys: [jig.datum_a_above_floor]
  z_rule: {z_min: shop_floor, z_max: shop_floor}
  depth: [-130, 130]
  label: null
  neighbours: []
  sense: []
  chain: []
  moves: false
  axes: [section]
  section_class: reference
- id: base_plate
  name: base plate
  shape: 'base plate cut, 12 thick, u -130 to -80.20 and 80.20 to 130 (break lines at the crop), spigot-hole gap +-80.20; aluminium hatch (Designer 1.4 (a) section 2 row base_plate, section 3)'
  kind: plate
  axis: null
  projection: rectangle
  keys: [icd.footprint_x, icd.footprint_y, base.plate_thickness, base.column_notch, base.column_notch_x, base.spigot_hole_dia]
  z_rule: {z_min: 0, z_max: base.plate_thickness}
  plan_poly:
  - - [-(icd.footprint_x / 2), '-(icd.footprint_y / 2 - base.column_notch[1])']
    - [icd.footprint_x / 2, '-(icd.footprint_y / 2 - base.column_notch[1])']
    - [icd.footprint_x / 2, 'icd.footprint_y / 2 - base.column_notch[1]']
    - [-(icd.footprint_x / 2), 'icd.footprint_y / 2 - base.column_notch[1]']
  - - [-(icd.footprint_x / 2), 'icd.footprint_y / 2 - base.column_notch[1]']
    - [-base.column_notch_x, 'icd.footprint_y / 2 - base.column_notch[1]']
    - [-base.column_notch_x, icd.footprint_y / 2]
    - [-(icd.footprint_x / 2), icd.footprint_y / 2]
  - - [base.column_notch_x, 'icd.footprint_y / 2 - base.column_notch[1]']
    - [icd.footprint_x / 2, 'icd.footprint_y / 2 - base.column_notch[1]']
    - [icd.footprint_x / 2, icd.footprint_y / 2]
    - [base.column_notch_x, icd.footprint_y / 2]
  - - [-(icd.footprint_x / 2), -(icd.footprint_y / 2)]
    - [-base.column_notch_x, -(icd.footprint_y / 2)]
    - [-base.column_notch_x, '-(icd.footprint_y / 2 - base.column_notch[1])']
    - [-(icd.footprint_x / 2), '-(icd.footprint_y / 2 - base.column_notch[1])']
  - - [base.column_notch_x, -(icd.footprint_y / 2)]
    - [icd.footprint_x / 2, -(icd.footprint_y / 2)]
    - [icd.footprint_x / 2, '-(icd.footprint_y / 2 - base.column_notch[1])']
    - [base.column_notch_x, '-(icd.footprint_y / 2 - base.column_notch[1])']
  label: {text: "plate hole", key: base.spigot_hole_dia, fmt: .1f}
