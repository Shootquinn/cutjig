# S1 spec, side XZ, whole jig, four poses (research/sean/gameplan.md detail 1.1, lines 207-239).
status: "signed (Designer, Loftsman; pose table confirmed by Sean 2026-11-25)"
# r2 edits (The Engineer, 2026-11-25, step1.1_engineer_revision_r2.md), re-sign due (Designer; Loftsman for placement):
# stack_ties (LF1.1-1), holder z_max + flange (LF1.1-1), section on receiver, collet, core_seat, holder, collar and
# bore_cone on holder (TP1.1-3), N -> C/F between section rows (TP1.1-3), gear face_rises (TP1.1-1), rubric line (TP1.1-2).
# r4 edits (The Engineer, 2026-11-25, step1.1_engineer_revision_r4.md): frame_upper_a/_b plan footprint 60 x 60 square,
# radial r 270 to 330 (LF1.1-8 = TP1.1-12); place field rot (deg, footprint turned about its centre) for controls.
# r3 edits (The Engineer, 2026-11-25, step1.1_engineer_revision_r3.md, from sketches/s1_visual_gate_r2.md F1 to F5),
# re-sign due (Designer; Loftsman for placement): rows bracket_anchor_a/_b, bracket_guide_a/_b (F2), descent_stop_post
# (F3), motor_shaft_a/_b and pinion_axis_a/_b (F1), labels on anchor_b, guide_b, frame_upper_b, drill_head (tip z_edge),
# drill_top_block (F4), fixed_g10 group extended to the new fixed rows, notes (holder stand-in, C meaning). All new
# dimensions are the Designer's ASSUMED values (M1 r2 section 6).
# Revision 1.1 (b), The Engineer, 2026-11-25, from research/sean/cr_scratch/step1.1_designer_params_review.md and
# Sean's rulings (gameplan Design Notes 21 G1-G7, Design Notes 22 option R). No drawing before the signed spec.
sketch: s1
script: s1_side_poses.py          # K1 scans this file at 1.1 (d) (check_sketch.py run_sketch, SW-18)
view: side_xz
z_rule_frame: z_A          # check_stack.py evaluates z_rule and tip_z in z_A and converts to z_S (shop floor) once
plot_frame: z_S            # z_S = z_A + jig.datum_a_above_floor (Design Notes 17)
notes:
  - "Holder section is a stand-in; S4 governs (build_parts/holder.py: OD 67.04, inner cone 62.04 to 56.75 over chain.H 30, bore 56.75, tube through the nut plate to the collar). Designer M1 r2 section 7; no S1 check value moves."
  - "Class C means 'located on that face'. Fit values (holder g_reg 0.25, spigot hole 0.10 per side, collar lift play) belong to S4 (base stack) and Step 4 tolerancing; no C pair states a clearance. Designer M1 r2 section 7 (Loftsman R2-1)."
question: >-
  Is the jig tall enough, where along the drill does the ring sit, where are the screw anchors and top guides,
  what are the park rule and the lift stroke, and which frame and base members carry the axial loop?
closes:
  R: [R1, R2, R3, R4, R5, R6, R7, R8, R17]
  Q: [Q1, Q9]
  carries_assumed: [Q2]
  re_derives: ["U13 park rule (option R: park 959.84 z_A = params upper.park_z)", "stop.height_range[1] 315 -> 184.84 (option R, Design Notes 22; params unchanged until Step 4, Quinn owns A2b)"]

# LF-9: K7 tolerance, as sketch_common.judge() and assess_pair() apply it (TOL_C 0.05 mm, TOL_AREA 0.01 mm2):
#   a G pair passes at distance >= g_min - 0.05; a C pair at distance <= 0.05 with overlap area <= 0.01 mm2;
#   an F pair at overlap area <= 0.01 mm2 (touching reads F). Every g_min below is read with this tolerance.
# Side views, plan-footprint lower bound (LF-8, Loftsman 1.1 (b) KEEP ruling, FIX 4c): an F pair passes when its plan
#   footprints are > 0.05 apart; a G pair when max(plan gap, projected distance) >= g_min - 0.05 (state plan-separated);
#   every footprint contains its part's plan projection; C pairs are not relieved.
# Pose-restricted declarations (FIX 3): a neighbour with `poses` declares the pair at those poses only; elsewhere the pair
#   is tested as undeclared F.
k7_tolerance: "G passes at distance >= g_min - 0.05 mm; C at distance <= 0.05 mm and overlap <= 0.01 mm2; F at overlap <= 0.01 mm2 (sketch_common TOL_C, TOL_AREA; LF-9). Side views: F passes when the plan footprints are > 0.05 apart; G when max(plan gap, projected distance) >= g_min - 0.05 (plan-separated); footprints contain the part; C pairs are not relieved (LF-8, FIX 4c). A neighbour with poses declares the pair at those poses only (FIX 3)."

# Core lengths. q9_length_keys: batch 1 Q9 stand-in (0.5 and 0.75 m). always_loaded: G2, the 0.75 m install core is
# the capture core, loaded under every Q9 option (so the 0.5 m only and 0.5 and 0.75 m options share one park).
q9_length_keys: [core.length_capture, core.length_install]
always_loaded: [core.length_install]
q9_options:
  "0.5 m only": [core.length_capture]
  "0.5 and 0.75 m": [core.length_capture, core.length_install]
  "plus 1 m": [core.length_capture, core.length_install, core.length_optional]
capture_core: core_750                   # G2: S1-5a and S1-7 read this row
capture_core_length: core.length_install

# Planes (LF-6, LF-16). load_plane: the plane the core stands on, read by S1-3 (G1, core stop 42.5 z_A).
# entry_plane: the plane the core bottom passes over while it enters the holder, read by the park rule
# (Design Notes 22: collar top 159.84 z_A). K6 lints each field: term and feature edge + offset agree within 0.05.
load_plane: {term: core_stop, feature: core_seat, edge: z_max, offset: 0}
entry_plane: {term: collar_top, feature: collar, edge: z_max, offset: 0}     # FIX 1: the collar row carries the plane
# LF1.1-1 (r2): stack ties, linted by K6 like the plane fields. The holder z_max (flange top) plus the nut plate
# (nut.plate_thickness + washer proud) plus collar.top_above_plate is the test_P18 collar top. The r1 rule
# (holder_bottom + holder.length, no flange) reads 8.00 apart (K6-B7).
stack_ties:
  - {id: holder_flange, term: collar_top, feature: holder, edge: z_max, offset: "nut.plate_thickness + washer.thickness - nut.washer_pocket_depth + collar.top_above_plate", source: "Loftsman 1.1 (e) LF1.1-1; check_stack.collar_top_z_A (test_P18)"}

# Park rule, option R (Design Notes 22). Per supported core class of length L:
#   stop_k  = max(stop.height_z, collet.core_stop_z + L + stop.g_stop - drill.bore_ceiling_above_tip)
#   start_k = stop_k + upper.travel_max
#   park    = max(max_k start_k, entry_plane + max L) + upper.load_clearance            (check_stack.park_tip_z_A)
# Values (DERIVED): stop 184.84 / 184.84 / 267.5, start 834.84 / 834.84 / 917.5 for 0.5 / 0.75 / 1.0 m;
# park 959.84 z_A (stand-in), 1209.84 with 1 m. Lift stroke = park - lowest stop_k = 775.00 (stand-in).
# OPEN, decision for Sean (Loftsman FIX 5, 1.1 (b)): for the 1 m class this rule gives stop 267.5 and start 917.5, and
# the 1 m core top on the core stop is 42.5 + 1000 = 1042.5 z_A, so the cutter starts 125.00 inside the uncut core
# (check_stack reported q9_options.start_minus_core_top: 292.34 / 42.34 / -125.00 for 0.5 / 0.75 / 1 m). The rule has
# no start-above-core term. The 1 m core is the third Q9 option and is not drawn in S1. No rule change at (b).
park_rule:
  stop_k: "max(stop.height_z, collet.core_stop_z + L + stop.g_stop - drill.bore_ceiling_above_tip)"
  start_k: "stop_k + upper.travel_max"
  park: "max(max_k start_k, entry_plane + max L) + upper.load_clearance"
  for_step4: "upper.park_z = max(max_k (max(stop.height_z, collet.core_stop_z + L_k + stop.g_stop - drill.bore_ceiling_above_tip) + upper.travel_max), stop.collar_top_z + max_k L_k) + upper.load_clearance"

# Screw length per Q9 option (reported, never asserted). stroke and park from check_stack per option.
# Loftsman B3 ruling (1.1 (b) section 2): L_min is the governing expression. g_min_screw_block = the spec g_min of
# nut_housing|anchor and nut_housing|guide (fixed_g10, g_min seed l.148), read by check_stack.screw_block_g_min; S1-4
# tests the same band on the drawing. "at anchor_z" is reported: the same constraint with the anchor at the drawn
# jackscrew.anchor_z. Superseded (Loftsman section 2.2): "stroke + a + g + nut_length" (omits 2 g_min) and
# "stroke + nut_length + a + g + nut_housing_height" (counts the coaxial 30 twice, omits g_min).
screw_length:
  L_min: "stroke + jackscrew.anchor_allowance + jackscrew.guide_allowance + max(jackscrew.nut_length, ring.nut_housing_height) + 2 * g_min_screw_block"
  at anchor_z: "park + ring.position_above_tip + ring.thickness / 2 + max(jackscrew.nut_length, ring.nut_housing_height) / 2 + jackscrew.guide_allowance + g_min_screw_block - jackscrew.anchor_z"

# TP-5: K7 tests every undeclared pair of drawn parts as F. Nests are declared class N with the nesting stated.
undeclared_pairs: F
# place: plan position of a part: r_in, r_out (default r_in), theta (deg, counter-clockwise from +X seen from +Z),
# half_width, footprint round (axis-Z part) or radial (radial-axis part; also a square section with one face toward the
# axis), optional rot (deg, radial footprint turned about its centre). Every footprint contains its whole part (K8
# projected_extent checks the drawn extent against it, TP1.1-11). check_stack derives the depth band and the
# projected x from it (LF-5, TP-4); K8 asserts the drawn x centre = r_c cos(theta) (TP-3).
# section: [r_in, r_out] of an axis-Z annulus drawn in section as one piece per side (mirrored about x = 0), or a list
#   of such pieces [r_in, r_out, z_lo, z_hi] (z in z_A stack names; omitted z = the row's z_rule).
# Drawing convention (TP1.1-8): rows with `section` are true half-sections; every other round row is a silhouette drawn
#   over them. Two section rows intersect in 3D exactly when their half-sections overlap, so K7 refuses class N between
#   two section rows (TP1.1-3). Silhouette rows keep N where they nest.
# bore_cone: <row id> (TP1.1-3): over the mate's z extent the row's bore follows the mate's outer cone; K5 admits the
#   four-vertex piece there, and the pair is declared C.

poses:
  - id: load
    tip_z: park_tip
    vars: {capture_core_bottom: "collet.core_stop_z + 0.5 * (stop.collar_top_z - collet.core_stop_z)"}
    cores: "0.75 m install core, solid, mid-insertion: bottom 101.17, top 851.17 z_A (TP-9 z_rule)"
    purpose: "operator lowers the core into the holder under the held ring (operator-task table)"
  - id: start
    tip_z: "stop.start_z[0]"
    vars: {capture_core_bottom: core_stop}
    cores: "0.75 m install core (capture core), solid, bottom on the core stop 42.5, top 792.5 z_A"
    purpose: "top of the 650 mm travel"
  - id: capture_end
    tip_z: "stop.height_z"
    vars: {capture_core_bottom: core_stop}
    cores: "0.75 m install core, solid, on the core stop, 607.66 of it above the tip"
    purpose: "lowest ring position; S1-5a, S1-5b, S1-7"
  - id: park
    tip_z: park_tip
    cores: "none; captured-core removal is N6 (Quinn)"
    purpose: "lift idle, top of the lift stroke, held by the Step 2 hold device"

rubric_additions:
  - "the ring assembly is on the drill tube between the head and the top-end block in every pose (K8 ring_on_tube: bearing clears_above drill_head, gear top_within drill_tube)"
  - "the motors sit on the same side of the gear in every pose, outboard of the pinions, below the gear back face (K8: motor23 side, outboard, top_within gear)"
  - "the 0.75 m core is drawn solid at load (mid-insertion), start and capture_end and is absent at park; no 0.5 m core is drawn (K9 by row poses, both half-spaces: drawn where it applies, no artist at a pose outside row.poses (TP1.1-2, K9-B5); solid line visual only)"
  - "the drill head is at the bottom and the top-end block at the top (K8: drill_head below gear, below drill_top_block)"
reported:
  - highest point at each pose and its margin to the 2000 mm soft target (jig.height_target, never asserted)
  - ring position along the drill (N1) and the anchor and guide heights it sets
  - re-derived park rule as an expression for Step 4 (park_rule.for_step4)
  - lift stroke and screw length L (screw_length expressions) for each Q9 option (q9_options)
  - centre-of-mass height per pose and unbolted tip force at the frame top (overlay masses ASSUMED; icd.tipover_statement is the old reference)
descent_stop: "drawn: row descent_stop, metal pad on post descent_stop_post on bracket arm bracket_anchor_a at jackscrew.angle[1], under the ring rim (N7 stand-in, upper.metal_stop DECLARED gate B5); Step 2 rules"

# Neighbour groups (sketch_loader.expand_neighbour_groups): {use: <group>} in a row's neighbours expands to these.
neighbour_groups:
  s1_5b_base:     # g_min seed l.150: ring assembly at its lowest pose against the fixed base parts (S1-5b)
    - {id: collet, class: G, g_min: 10, poses: [capture_end], group: S1-5b, source: "g_min seed l.150 ASSUMED; Designer 1.1 (a) section 7"}
    - {id: holder, class: G, g_min: 10, poses: [capture_end], group: S1-5b, source: "g_min seed l.150 ASSUMED; Designer 1.1 (a) section 7"}
    - {id: wingnut, class: G, g_min: 10, poses: [capture_end], group: S1-5b, source: "g_min seed l.150 ASSUMED; wingnut.sweep_clear_radius DERIVED"}
    - {id: receiver, class: G, g_min: 10, poses: [capture_end], group: S1-5b, source: "g_min seed l.150 ASSUMED"}
    - {id: base_plate, class: G, g_min: 10, poses: [capture_end], group: S1-5b, source: "g_min seed l.150 ASSUMED"}
    - {id: base_frame, class: G, g_min: 10, poses: [capture_end], group: S1-5b, source: "g_min seed l.150 ASSUMED"}
    - {id: collar, class: G, g_min: 10, poses: [capture_end], group: S1-5b, source: "g_min seed l.150 ASSUMED; holder collar ring, highest clamped base feature (Loftsman 1.1 (b) FIX 1)"}
  fixed_g10:      # g_min seed l.148: moving parts against fixed frame members, screw blocks and lift motors (swept)
    - {id: frame_upper_a, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; Designer 1.1 (a) section 7"}
    - {id: frame_upper_b, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; Designer 1.1 (a) section 7"}
    - {id: liftmotor_a, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; lift motor below the anchor (R6)"}
    - {id: liftmotor_b, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; lift motor below the anchor (R6)"}
    - {id: anchor_a, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; nut housing to anchor block 10.84 at capture_end"}
    - {id: anchor_b, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; nut housing to anchor block 10.84 at capture_end"}
    - {id: guide_a, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; nut housing to guide block 24.16 at park"}
    - {id: guide_b, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; nut housing to guide block 24.16 at park"}
    - {id: bracket_anchor_a, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; Designer M1 r2 F2: arm z = block z, nut housing 10.84 at capture_end, ring rim 19.84"}
    - {id: bracket_anchor_b, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; Designer M1 r2 F2: arm z = block z"}
    - {id: bracket_guide_a, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; Designer M1 r2 F2: nut housing 24.16 at park"}
    - {id: bracket_guide_b, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; Designer M1 r2 F2: nut housing 24.16 at park"}
    - {id: descent_stop_post, class: G, g_min: 10, source: "g_min seed l.148 ASSUMED; Designer M1 r2 F3: ring rim 12.00 above the post top at capture_end; nut housing plan gap 15.0"}

# Row fields per gameplan l.130. shape: The Designer's note (1.1 (a) section 2). z_rule in z_A.
features:
  - id: floor
    name: shop floor
    shape: "shop floor line across the full footprint, ground hatch below"
    kind: line
    axis: null
    projection: line
    keys: [jig.datum_a_above_floor, icd.footprint_x]
    z_rule: {z_min: shop_floor, z_max: shop_floor}
    depth: null
    label: null
    neighbours: []
    sense: []
    chain: []
    moves: false

  - id: base_frame
    name: base frame
    shape: "30-6060 base frame: side rails along X seen as a 60 mm band over footprint_x; end members as 60 x 60 sections at x = +/- frame.end_x"
    kind: prism
    axis: X
    projection: rectangle
    keys: [profile.height, profile.width, icd.footprint_x, icd.footprint_y]
    z_rule: {z_min: shop_floor, z_max: 0}
    depth: ["-icd.footprint_y / 2", "icd.footprint_y / 2"]
    label: null
    neighbours: [{id: base_plate, class: C, g_min: 0, source: "icd.datum_a (frame top plane = plate underside)"}]
    sense: [{pred: below, of: base_plate}]
    chain: [axial]
    moves: false

  - id: base_plate
    name: base plate
    shape: "base plate in section, base.plate_thickness on the frame top, break at the receiver spigot hole"
    kind: plate
    axis: null
    projection: rectangle
    keys: [base.plate_thickness, icd.footprint_x, icd.footprint_y]
    z_rule: {z_min: 0, z_max: "base.plate_thickness"}
    depth: ["-icd.footprint_y / 2", "icd.footprint_y / 2"]
    label: null
    neighbours:
      - {id: receiver, class: C, g_min: 0, source: "receiver.spigot_od in base.spigot_hole_dia"}
    sense: []
    chain: [axial]
    moves: false

  - id: receiver
    name: receiver
    shape: "receiver cup in section: walls to the rim, floor at icd.floor_above_datum_a with the debris-hole gap, spigot into the plate, thread ticks on the outer wall"
    kind: cylinder
    axis: Z
    projection: rectangle
    keys: [base.plate_thickness, icd.floor_above_datum_a, receiver.rim_above_floor, receiver.spigot_od, receiver.floor_hole_dia, receiver.register_bore_radius]
    z_rule: {z_min: "base.plate_thickness", z_max: "receiver_floor + receiver.rim_above_floor"}
    # cup in section (TP1.1-3): floor either side of the debris hole up to the receiver floor; wall register bore to spigot OD
    section:
      - ["receiver.floor_hole_dia / 2", "receiver.register_bore_radius", "base.plate_thickness", receiver_floor]
      - ["receiver.register_bore_radius", "receiver.spigot_od / 2"]
    depth: ["-receiver.spigot_od / 2", "receiver.spigot_od / 2"]
    label: null
    neighbours:
      - {id: collet, class: C, g_min: 0, source: "R6: collet foot on the receiver floor, outer edge at the register bore (TP1.1-3: section rows, N refused)"}
      - {id: core_seat, class: C, g_min: 0, source: "R6: core-seat ledge on the receiver floor top (TP1.1-3: section rows, N refused)"}
      - {id: holder, class: C, g_min: 0, source: "R6: holder tube in the register bore (S1 draws holder OD = register bore; build_parts/holder.py has g_reg 0.25), flange above the rim (TP1.1-3)"}
      - {id: wingnut, class: N, source: "R6: wing nut threaded on the receiver"}
      - {id: core_750, class: N, source: "R6: core inside the receiver bore"}
    sense: []
    chain: [axial]
    moves: false

  - id: collet
    name: collet
    shape: "collet cone in section, two four-vertex sides mirrored about the axis: foot ring on the receiver floor, outer cone narrowing upward at cone.alpha 10 deg, slit ticks"
    kind: cone
    axis: Z
    projection: trapezoid
    keys: [icd.floor_above_datum_a, collet.slit_length, collet.slit_ligament, collet.relief_hole_dia, receiver.register_bore_radius, cone.alpha]
    z_rule: {z_min: receiver_floor, z_max: "receiver_floor + collet.slit_length + collet.slit_ligament + collet.relief_hole_dia / 2"}
    section: ["core.diameter_nominal / 2", "receiver.register_bore_radius"]
    depth: ["-receiver.register_bore_radius", "receiver.register_bore_radius"]
    label: null
    neighbours:
      - {id: core_seat, class: C, g_min: 0, source: "R6: core-seat ledge at the collet bore bottom, outer edge on the bore (TP1.1-3: section rows, N refused)"}
      - {id: holder, class: C, g_min: 0, source: "R6: holder clamps the collet cone; contact on the cone face (TP1.1-3: r1 drew 313.12 mm2 per side of interference under N)"}
      - {id: core_750, class: N, source: "R6: core in the collet bore"}
    sense: [{pred: taper, narrows: up, source: "TP-2 ruling (Design Notes 22): build_parts/collet_family.py dims() r(z) = r0 - (z - z_cone) tan(cone.alpha)"}]
    chain: [axial]
    moves: false

  - id: core_seat
    name: collet core seat
    shape: "core-seat ledge, collet.core_seat_height 2.5 tall and core_seat_width 3 wide, inside the collet bore bottom; core bottom bears on its top"
    kind: prism
    axis: null
    projection: rectangle
    keys: [icd.floor_above_datum_a, collet.core_seat_height, collet.core_seat_width, core.diameter_nominal, collet.core_stop_z]
    # z_max is the geometric expression; LF-16 compares it with the stack term core_stop (= collet.core_stop_z)
    z_rule: {z_min: receiver_floor, z_max: "receiver_floor + collet.core_seat_height"}
    section: ["core.diameter_nominal / 2 - collet.core_seat_width", "core.diameter_nominal / 2"]
    depth: ["-core.diameter_nominal / 2", "core.diameter_nominal / 2"]
    label: null
    neighbours: []
    sense: []
    chain: [axial]
    moves: false

  - id: holder
    name: holder
    shape: "holder tube in section with flange and collar ring on top; flange above the receiver rim by the stroke gap"
    kind: cylinder
    axis: Z
    projection: rectangle
    keys: [seat.holder_bottom_R, holder.stroke_gap_R, witness.zone_high, holder.length, holder.flange_od, holder.flange_thickness, cone.alpha, nut.plate_thickness, washer.thickness, nut.washer_pocket_depth, collar.top_above_plate]
    # LF1.1-1 (r2): holder.length excludes the flange (test_P18; build_parts/holder.py flange at L to L + t_f). Flange
    # underside 137.09 z_A, 8.59 above the rim (= witness.zone_high, pose K d+1). stack_ties.holder_flange lints this edge.
    z_rule: {z_min: holder_bottom, z_max: "holder_bottom + holder.length + holder.flange_thickness"}
    section:
      - ["core.diameter_nominal / 2", "receiver.register_bore_radius", holder_bottom, "holder_bottom + holder.length"]
      - ["core.diameter_nominal / 2", "holder.flange_od / 2", "holder_bottom + holder.length", "holder_bottom + holder.length + holder.flange_thickness"]
    bore_cone: collet     # TP1.1-3: over the collet height the holder bore follows the collet outer cone (Designer confirms, M1)
    depth: ["-holder.flange_od / 2", "holder.flange_od / 2"]
    label: null
    neighbours:
      - {id: wingnut, class: N, source: "R6: wing nut over the holder flange"}
      - {id: core_750, class: N, source: "R6: core in the holder bore"}
    sense: []
    chain: [axial]
    moves: false

  - id: wingnut
    name: wing nut
    shape: "wing nut: body wingnut.body_od x nut.overall_height, two wings to span 230, sweep radius 115 as dashed extent lines"
    kind: prism
    axis: null
    projection: rectangle
    keys: [stop.collar_top_z, collar.top_above_plate, nut.overall_height, wingnut.sweep_clear_radius, wingnut.span]
    z_rule: {z_min: "collar_top - collar.top_above_plate - nut.overall_height", z_max: "collar_top - collar.top_above_plate"}
