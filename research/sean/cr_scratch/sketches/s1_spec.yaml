  - id: guide_a
    name: top guide
    shape: "radial support block at the screw top"
    kind: prism
    axis: null
    projection: rectangle
    keys: [jackscrew.top_guide_z, jackscrew.guide_allowance]
    z_rule: {z_min: "jackscrew.top_guide_z - jackscrew.guide_allowance", z_max: "jackscrew.top_guide_z"}
    depth: ["jackscrew.pitch_radius * sind(jackscrew.angle[1]) - jackscrew.nut_flange_od / 2", "jackscrew.pitch_radius * sind(jackscrew.angle[1]) + jackscrew.nut_flange_od / 2"]
    label: null
    neighbours: []
    sense: []
    chain: []
    moves: false

  - id: guide_b
    name: top guide
    shape: "radial support block at the screw top"
    kind: prism
    axis: null
    projection: rectangle
    keys: [jackscrew.top_guide_z, jackscrew.guide_allowance]
    z_rule: {z_min: "jackscrew.top_guide_z - jackscrew.guide_allowance", z_max: "jackscrew.top_guide_z"}
    depth: ["jackscrew.pitch_radius * sind(jackscrew.angle[0]) - jackscrew.nut_flange_od / 2", "jackscrew.pitch_radius * sind(jackscrew.angle[0]) + jackscrew.nut_flange_od / 2"]
    label: null
    neighbours: []
    sense: []
    chain: []
    moves: false

  - id: liftmotor_a
    name: NEMA 17 lift motor
    shape: "body and shaft above the top guide (option; S3 draws the choice)"
    kind: cylinder
    axis: Z
    projection: rectangle
    keys: [liftmotor.body, liftmotor.length, jackscrew.top_guide_z]
    z_rule: {z_min: "jackscrew.top_guide_z", z_max: "jackscrew.top_guide_z + liftmotor.length"}
    depth: ["jackscrew.pitch_radius * sind(jackscrew.angle[1]) - liftmotor.body / 2", "jackscrew.pitch_radius * sind(jackscrew.angle[1]) + liftmotor.body / 2"]
    label: null
    neighbours: []
    sense: [{pred: above, of: guide_a}]
