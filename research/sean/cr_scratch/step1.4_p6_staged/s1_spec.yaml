  carries_assumed: [Q2]
  re_derives: ["U13 park rule (option R: park 959.84 z_A = params upper.park_z)", "stop.height_range[1] 315 -> 184.84 (option R, Design Notes 22; params unchanged until Step 4, Quinn owns A2b)"]

# LF-9: K7 tolerance, as sketch_common.judge() and assess_pair() apply it (TOL_C 0.05 mm, TOL_AREA 0.01 mm2):
#   a G pair passes at distance >= g_min - 0.05; a C pair at distance <= 0.05 with overlap area <= 0.01 mm2;
#   an F pair at overlap area <= 0.01 mm2 (touching reads F). Every g_min below is read with this tolerance.
# Side views, plan-footprint lower bound (LF-8, Loftsman 1.1 (b) KEEP ruling, FIX 4c): an F pair passes when its plan
#   footprints are > 0.05 apart; a G pair when max(plan gap, projected distance) >= g_min - 0.05 (state plan-separated);
#   every footprint contains its part's plan projection; C pairs are not relieved.
# Pose-restricted declarations (FIX 3): a neighbour with `poses` declares the pair at those poses only; elsewhere the pair
#   is tested as undeclared F.
k7_tolerance: "G passes at distance >= g_min - 0.05 mm; C at distance <= 0.05 mm and overlap <= 0.01 mm2; F at overlap <= 0.01 mm2 (sketch_common TOL_C, TOL_AREA; LF-9). Side views: F passes when the plan footprints are > 0.05 apart; G when max(plan gap, projected distance) >= g_min - 0.05 (plan-separated); footprints contain the part; C pairs are not relieved (LF-8, FIX 4c). A neighbour with poses declares the pair at those poses only (FIX 3)."

# Core lengths. q9_length_keys: batch 1 Q9 stand-in (0.5 and 0.75 m). always_loaded: G2, the 0.75 m install core is
# the capture core, loaded under every Q9 option (so the 0.5 m only and 0.5 and 0.75 m options share one park).
q9_length_keys: [core.length_capture, core.length_install]
always_loaded: [core.length_install]
q9_options:
  "0.5 m only": [core.length_capture]
  "0.5 and 0.75 m": [core.length_capture, core.length_install]
  "plus 1 m": [core.length_capture, core.length_install, core.length_optional]
capture_core: core_750                   # G2: S1-5a and S1-7 read this row
capture_core_length: core.length_install

# Planes (LF-6, LF-16). load_plane: the plane the core stands on, read by S1-3 (G1, core stop 42.5 z_A).
# entry_plane: the plane the core bottom passes over while it enters the holder, read by the park rule
# (Design Notes 22: collar top 159.84 z_A). K6 lints each field: term and feature edge + offset agree within 0.05.
load_plane: {term: core_stop, feature: core_seat, edge: z_max, offset: 0}
entry_plane: {term: collar_top, feature: collar, edge: z_max, offset: 0}     # FIX 1: the collar row carries the plane
# LF1.1-1 (r2): stack ties, linted by K6 like the plane fields. The holder z_max (flange top) plus the nut plate
# (nut.plate_thickness + washer proud) plus collar.top_above_plate is the test_P18 collar top. The r1 rule
# (holder_bottom + holder.length, no flange) reads 8.00 apart (K6-B7).
stack_ties:
  - {id: holder_flange, term: collar_top, feature: holder, edge: z_max, offset: "collar.thickness", source: "Loftsman 1.1 (e) LF1.1-1; check_stack.collar_top_z_A (test_P18); 1.4 S4-b (s4_spec x1_edits_at_p6 item 3): the holder z_max is the tube top, collar.thickness below the collar top"}
# 1.3 step 0 R2 (Loftsman 1.2 (b) NOTE 2): member z_max - profile.height = top guide; term top_guide = jackscrew.top_guide_z
# (check_stack.global_vars), so a jackscrew.length change that leaves the member tops behind fires here and in K2.
  - {id: member_top_a, term: top_guide, feature: frame_upper_a, edge: z_max, offset: "-profile.height", source: "Loftsman 1.2 (b) NOTE 2; overlay frame_upper.member_length / member_length_rail expr (K2); 1.3 step 0 R2"}
  - {id: member_top_b, term: top_guide, feature: frame_upper_b, edge: z_max, offset: "-profile.height", source: "Loftsman 1.2 (b) NOTE 2; overlay frame_upper.member_length / member_length_rail expr (K2); 1.3 step 0 R2"}

# Park rule, option R (Design Notes 22), with the start-above-core term (Design Notes 23, Sean's FIX 5 ruling; H5,
# 1.2 step 0). Per supported core class of length L:
#   stop_k  = max(stop.height_z, collet.core_stop_z + L + stop.g_stop - drill.bore_ceiling_above_tip,
#                 collet.core_stop_z + L + c - upper.travel_max)
#   start_k = stop_k + upper.travel_max
#   park    = max(max_k start_k, entry_plane + max L) + upper.load_clearance            (check_stack.park_tip_z_A)
# c: clearance of the start tip above the top of the class's core on the core stop. Owned by Sean (N11); no value. It is
# a spec symbol (symbols.c below), so check_stack carries it as an expression and reports every value that reads it as
# an expression with the range of c it holds for; a drawn value that would depend on c is an error (check_stack.numeric).
# Values (DERIVED, c >= 0): stop 184.84 / 184.84 / 392.50 + c, start 834.84 / 834.84 / 1042.50 + c for 0.5 / 0.75 / 1 m;
# capture for the 1 m class 650 - c; park 959.84 z_A (stand-in), 1209.84 with 1 m; lift stroke 775.00 (stand-in),
# 1025.00 with 1 m; L 885.00 / 1135.00 (buy 900 / 1140); start_minus_core_top 292.34 / 42.34 / c.
# Ranges (DERIVED): the 0.75 m class start stays 834.84 while c <= 42.34 (the term reads 142.50 + c there); the 0.5 m
# class while c <= 292.34; park 1209.84, stroke 1025 and L 1140 with the 1 m class while c <= 117.34 (entry plane
# 159.84 + 1000 + 50 governs). Design Notes 23 holds for 0 <= c <= 42.34; above it the 0.75 m start rises with c.
symbols:
  c: {domain: [0, null], unit: mm, owner: "Sean (N11)", source: "Design Notes 23 (FIX 5 ruling): 1 m stop 392.50 + c, start 1042.50 + c z_A, capture 650 - c", status: "no value; reported as an expression"}
park_rule:
  stop_k: "max(stop.height_z, collet.core_stop_z + L + stop.g_stop - drill.bore_ceiling_above_tip, collet.core_stop_z + L + c - upper.travel_max)"
  start_k: "stop_k + upper.travel_max"
  park: "max(max_k start_k, entry_plane + max L) + upper.load_clearance"
  for_step4: "upper.park_z = max(max_k (max(stop.height_z, collet.core_stop_z + L_k + stop.g_stop - drill.bore_ceiling_above_tip, collet.core_stop_z + L_k + c - upper.travel_max) + upper.travel_max), stop.collar_top_z + max_k L_k) + upper.load_clearance; c = start clearance above the core top (Sean, N11)"

# Screw length per Q9 option (reported, never asserted). stroke and park from check_stack per option.
# Loftsman B3 ruling (1.1 (b) section 2): L_min is the governing expression. g_min_screw_block = the spec g_min of
# nut_housing|anchor and nut_housing|guide (fixed_g10, g_min seed l.148), read by check_stack.screw_block_g_min; S1-4
# tests the same band on the drawing. "at anchor_z" is reported: the same constraint with the anchor at the drawn
# jackscrew.anchor_z. Superseded (Loftsman section 2.2): "stroke + a + g + nut_length" (omits 2 g_min) and
# "stroke + nut_length + a + g + nut_housing_height" (counts the coaxial 30 twice, omits g_min).
screw_length:
  L_min: "stroke + jackscrew.anchor_allowance + jackscrew.guide_allowance + max(jackscrew.nut_length, ring.nut_housing_height) + 2 * g_min_screw_block"
  at anchor_z: "park + ring.position_above_tip + ring.thickness / 2 + max(jackscrew.nut_length, ring.nut_housing_height) / 2 + jackscrew.guide_allowance + g_min_screw_block - jackscrew.anchor_z"

# TP-5: K7 tests every undeclared pair of drawn parts as F. Nests are declared class N with the nesting stated.
undeclared_pairs: F
# place: plan position of a part: r_in, r_out (default r_in), theta (deg, counter-clockwise from +X seen from +Z),
# half_width, footprint round (axis-Z part) or radial (radial-axis part; also a square section with one face toward the
# axis), optional rot (deg, radial footprint turned about its centre). Every footprint contains its whole part (K8
# projected_extent checks the drawn extent against it, TP1.1-11). check_stack derives the depth band and the
# projected x from it (LF-5, TP-4); K8 asserts the drawn x centre = r_c cos(theta) (TP-3).
# section: [r_in, r_out] of an axis-Z annulus drawn in section as one piece per side (mirrored about x = 0), or a list
#   of such pieces [r_in, r_out, z_lo, z_hi] (z in z_A stack names; omitted z = the row's z_rule).
# Drawing convention (TP1.1-8): rows with `section` are true half-sections; every other round row is a silhouette drawn
#   over them. Two section rows intersect in 3D exactly when their half-sections overlap, so K7 refuses class N between
#   two section rows (TP1.1-3). Silhouette rows keep N where they nest.
# bore_cone: <row id> (TP1.1-3): over the mate's z extent the row's bore follows the mate's outer cone; K5 admits the
#   four-vertex piece there, and the pair is declared C.

poses:
  - id: load
    tip_z: park_tip
    vars: {capture_core_bottom: "collet.core_stop_z + 0.5 * (stop.collar_top_z - collet.core_stop_z)"}
    cores: "0.75 m install core, solid, mid-insertion: bottom 101.17, top 851.17 z_A (TP-9 z_rule)"
    purpose: "operator lowers the core into the holder under the held ring (operator-task table)"
  - id: start
    tip_z: "stop.start_z[0]"
    vars: {capture_core_bottom: core_stop}
    cores: "0.75 m install core (capture core), solid, bottom on the core stop 42.5, top 792.5 z_A"
    purpose: "top of the 650 mm travel"
  - id: capture_end
    tip_z: "stop.height_z"
    vars: {capture_core_bottom: core_stop}
    cores: "0.75 m install core, solid, on the core stop, 607.66 of it above the tip"
    purpose: "lowest ring position; S1-5a, S1-5b, S1-7"
  - id: park
    tip_z: park_tip
    cores: "none; captured-core removal is N6 (Quinn)"
    purpose: "lift idle, top of the lift stroke, held by the Step 2 hold device"

