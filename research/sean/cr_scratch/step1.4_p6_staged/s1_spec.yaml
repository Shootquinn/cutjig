  - {id: lift_stroke_q9, text: "Lift stroke per Q9 option (0.5 m only; 0.5 and 0.75 m; plus 1 m), with the c terms", source: "check_stack.reported q9_options lift_stroke, symbol_terms", needs_drawing: false}
