# params.yaml - seed (Step 1). Every leaf: value, unit, source, status.
# status in {DECLARED, ASSUMED, VERIFIED, DERIVED}. Units mm unless stated.
# FCStd is the authority once it exists; this file is the seed (llm_plm_cad 2.8).
# No printer keys (gate B2): no bed, material or nozzle values, no part splitting.

meta:
  units: {value: mm, unit: "", source: "gameplan Design Notes 4", status: DECLARED}
  seed_date: {value: "2026-11-08", unit: "", source: "Step 1 run", status: DECLARED}

iris:
  throat_open_radius: {value: 54.2925, unit: mm, source: "gate B1 (research/quinn/cr_scratch/step0_human_gate_decisions.md) rules 54.2925 a radius; number at double_dong_params.py line 92 (re-read Step 1). A parameter: the new drill is being fabricated and it may change. Change the radius only; the diameter follows.", status: DECLARED}
  throat_open_diameter: {value: 108.585, unit: mm, source: "2 x iris.throat_open_radius (gate B1 states 108.585 mm); validate_params rejects any mismatch", status: DERIVED}
  leaf_count: {value: 4, unit: "", source: "double_dong_params.py 93-98 (7 in model; re-read Step 1)", status: VERIFIED}
  leaf_thickness: {value: 3.175, unit: mm, source: "double_dong_params.py 402-404 (plate thickness 0.125 in; 7 in model; re-read Step 1)", status: VERIFIED}
  face_radius_core: {value: 71.4375, unit: mm, source: "double_dong_params.py 360, 366-368 (7 in model; re-read Step 1)", status: VERIFIED}
  face_radius_rock: {value: 74.6125, unit: mm, source: "double_dong_params.py 366-368 (7 in model; re-read Step 1)", status: VERIFIED}
  closure_deg: {value: -62, unit: deg, source: "double_dong_params.py line 92 (7 in model; re-read Step 1)", status: VERIFIED}

core:
  diameter_nominal: {value: 100, unit: mm, source: "INSITU2_text.md 406-407 (Phase I EDU cores); conflict: Figure 2 caption 186-188 says full-scale core diameter is above 100 mm", status: VERIFIED}
  diameters: {value: [90.0, 92.5, 95.0, 97.5, 100.0, 102.5, 105.0], unit: mm, source: "workorder.md range 90 to 105; gate B3 seven collets at 2.5 mm (single source for core diameters and the collet family)", status: DECLARED}
  tol: {value: 1.0, unit: mm, source: "Design Notes 12 assumption: covers Mines manufacturing variation; Phase I data replaces it", status: ASSUMED}
  length_capture: {value: 500, unit: mm, source: "gate B6 (capture goal 0.5 m)", status: DECLARED}
  length_install: {value: 750, unit: mm, source: "gate B6 (install 0.75 m)", status: DECLARED}
  length_optional: {value: 1000, unit: mm, source: "gate B6 (optional 1 m)", status: DECLARED}
  density: {value: 2400, unit: "kg/m3", source: "Design Notes 12 assumption; Mines density not stated", status: ASSUMED}
  min_exposed: {value: 143.12, unit: "mm", source: "F4: drill.kerf_standoff 106.369 + stop.g_stop 25 + stop.margin 5 = 136.369, plus collar.top_above_plate 6.75 = 143.119 (was 128.12 at g_stop 10) (research/quinn/cr_scratch/step2_loftsman_crossreview_reply.md section 4; research/quinn/cr_scratch/step2_system_concept.md ICD row Exposed core)", status: DERIVED}
  mass_kg_d105: {value: [10.4, 15.6, 20.8], unit: "kg", source: "d = 105, 2400 kg/m3, lengths 0.5 / 0.75 / 1 m (research/quinn/cr_scratch/step2_system_concept.md decision 3b)", status: DERIVED}

upper:
  travel_max: {value: 500, unit: "mm", source: "gate B6 (upper assembly working stroke at most 0.5 m); the loading park is separate (upper.park_z), research/quinn/cr_scratch/step2_system_concept.md U13", status: DECLARED}
  metal_stop: {value: "metal descent stop, owned by the upper assembly, rated 1000 N axial; the nut is never a stop", unit: "", source: "gate B5 (stop owner); research/quinn/cr_scratch/step2_system_concept.md decision 8 (i) and ICD rows Stop rating, Stop gap", status: DECLARED}
  captured_length: {value: 465.07, unit: "mm", source: "500 mm core minus dome_pole_offset 34.93; one stroke of 500 retains this (research/quinn/cr_scratch/step2_system_concept.md Items from my draft)", status: DERIVED}
  drill_advance_500core: {value: 534.93, unit: "mm", source: "500 + 34.93 dome offset; exceeds travel_max, ceiling holds (research/quinn/cr_scratch/step2_system_concept.md)", status: DERIVED}
  park_z: {value: 959.84, unit: "mm", source: "U13: stop.collar_top_z 159.84 + core.length_install 750 + upper.load_clearance 50 = 959.84 (was 950); a loading position, not working travel; the rule follows core length (1209.84 for the 1 m core) (research/quinn/cr_scratch/step2_system_concept.md)", status: ASSUMED}
  park_stroke: {value: 775.0, unit: "mm", source: "U13: carriage range from the stop to the park = upper.park_z 959.84 - stop.height_z 184.84 = 775 (was 780); NOT working travel (research/quinn/cr_scratch/step2_system_concept.md)", status: DERIVED}
  park_lock: {value: "metal pin latch above the working range (above start_z 800), visible locked flag; positive mechanical, flagged", unit: "", source: "U13 (research/quinn/cr_scratch/step2_system_concept.md); flagged for the human", status: ASSUMED}
  manual_raise: {value: "ratchet hoist, hand force at most 80 N, raise at least 100 mm, drill unpowered; load path carriage, hoist, cross member, columns, frame, no printed part", unit: "", source: "U15 (research/quinn/cr_scratch/step2_system_concept.md); 80 N is an assumption", status: ASSUMED}
  raise_fuse: {value: 300, unit: "N", source: "U15: shear link in the hoist line = 147 N carriage weight + 150 N jam force; jam force on the core at most 150 N below the 204 N of H2 (research/quinn/cr_scratch/step2_system_concept.md)", status: ASSUMED}
  load_clearance: {value: 50, unit: "mm", source: "clearance of the cutter lowest point above the core bottom at the loading park (U13 rule)", status: ASSUMED}

jig:
  height_target: {value: 2000, unit: mm, source: "gate B6 (2 m soft target; recorded and reported, never tested as a limit)", status: DECLARED}
  height_is_soft: {value: true, unit: "", source: "gate B6 (yields to design freedom)", status: DECLARED}

loads:
  torque_design: {value: 10, unit: "N m", source: "gate B4 (design assumption; 20 and 50 N m placeholders retired; no positive core lock)", status: DECLARED}
  axial_design: {value: 1000, unit: N, source: "design choice bounded by the Phase I WOB test range, INSITU3_text.md 424-430", status: ASSUMED}
  wob_min: {value: 100, unit: N, source: "INSITU3_text.md 424-430 (Phase I test range)", status: VERIFIED}
  wob_max: {value: 1000, unit: N, source: "INSITU3_text.md 424-430 (Phase I test range)", status: VERIFIED}
  nut_torque: {value: 12, unit: "N m", source: "nut torque used for the holding prediction, hand limit (research/quinn/cr_scratch/step2_loftsman_crossreview_reply.md section 5)", status: ASSUMED}
  lateral: {value: 100, unit: "N", source: "lateral load on the core at 106.4 mm or more above the holder (research/quinn/cr_scratch/step2_system_concept.md decision 3a)", status: ASSUMED}
  lateral_moment: {value: 10.6, unit: "N m", source: "100 N x 0.1064 m (research/quinn/cr_scratch/step2_system_concept.md decision 3a)", status: DERIVED}
  h3_side_load: {value: 21.2, unit: "N", source: "10.6 N m / 0.5 m: H3 load at the top of a 0.5 m core (research/quinn/cr_scratch/step2_system_concept.md decision 3)", status: DERIVED}
  nut_torque_abuse: {value: 25, unit: "N m", source: "abuse torque (research/quinn/cr_scratch/step3_designer_params.md S2-7c); axial about 0.8 kN by linear scaling of 1.6 kN at 50 N m; ten-member check runs in Step 5", status: ASSUMED}
  hand_force_bar: {value: 100, unit: "N", source: "hand force on a tommy bar (research/quinn/cr_scratch/step3_designer_params.md S2-7c)", status: ASSUMED}

drill:
  tube_od: {value: 152.4, unit: mm, source: "workorder.md 6.00 in tubing OD; used as keep-out, NOT a cutter OD (Fact-Checker F-3)", status: ASSUMED}
  tube_id: {value: 146.05, unit: mm, source: "workorder.md 5.75 in tubing ID; keep-out", status: ASSUMED}
  tube_wall: {value: 3.175, unit: mm, source: "(152.4 - 146.05) / 2", status: DERIVED}
  r_face_margin: {value: 10, unit: mm, source: "Design Notes 12: R_face = 76.2 + 10 mm", status: ASSUMED}
  r_face: {value: 86.2, unit: mm, source: "tube_od / 2 + r_face_margin", status: DERIVED}
  kerf_standoff: {value: 106.369, unit: mm, source: "double_dong_params.py 372-378: head tip to kerf SPHERE CENTRE, 7 in model, not the pinch plane; carried to the 6 in drill by assumption", status: ASSUMED}
  dome_pole_offset: {value: 34.9315, unit: mm, source: "double_dong_params.py 379-380: 106.369 - 71.4375", status: DERIVED}
  cutter_od_7in: {value: 177.8, unit: mm, source: "borebot_operating_envelope.md line 29 via Fact-Checker F-3; 7 in generation, reference only", status: VERIFIED}

collets:
  # The family list lives only in core.diameters. A custom collet is a generator argument, not a params edit.
  count: {value: 7, unit: "", source: "gate B3", status: DECLARED}
  spacing: {value: 2.5, unit: mm, source: "gate B3", status: DECLARED}
  envelope_min: {value: 85.0, unit: mm, source: "generator envelope default, Detail 1", status: ASSUMED}
  min_throat_slack: {value: 1.0, unit: mm, source: "Designer defect B1: slack kept between the largest core plus tolerance and the open throat", status: ASSUMED}
  envelope_max: {value: 106.585, unit: mm, source: "iris.throat_open_diameter - core.tol - collets.min_throat_slack = 108.585 - 1.0 - 1.0; the generator default of 110 exceeded the throat. A collet above this needs a larger throat (change iris.throat_open_radius).", status: DERIVED}
  grip_window: {value: "accepts d - 1.5 to d + 1.0 (window 2.5, centre d - 0.25); coverage 88.5 to 106.0 against the core range 89 to 106", unit: "", source: "Loftsman W-1 (research/quinn/cr_scratch/step2_system_concept.md decision 7)", status: DERIVED}

collet:
  c_i: {value: 1.0, unit: mm, source: "bore_free(d) = d + tau + c_i; seed d + 2 mm (Echo registry), tau = core.tol", status: ASSUMED}
  slit_count: {value: 12, unit: "", source: "Design Notes 11 seed N = 12; confirmed in research/quinn/cr_scratch/step2_system_concept.md decision 7", status: ASSUMED}
  slit_width_seed: {value: 1.5, unit: "mm", source: "Echo registry seed w_s about 1.5 mm; confirmed in research/quinn/cr_scratch/step2_system_concept.md decision 7", status: ASSUMED}
  clamped_slit: {value: 0.584, unit: "mm", source: "1.5 - pi x 3.5 / 12 (research/quinn/cr_scratch/step2_loftsman_crossreview_reply.md section 2, alternating slits)", status: DERIVED}
  grip_window_lo: {value: -1.5, unit: "mm", source: "window floor relative to d: K-max core is d - 1.5 (research/quinn/cr_scratch/step2_system_concept.md decision 7)", status: DERIVED}
  grip_window_hi: {value: 1.0, unit: "mm", source: "window top relative to d: K core is d + 1.0 (research/quinn/cr_scratch/step2_system_concept.md decision 7)", status: DERIVED}
  delta: {value: 3.5, unit: mm, source: "Delta = s + c_i = (collet.grip_window_hi - collet.grip_window_lo) + collet.c_i = 2.5 + 1.0; the thread.major chain, C5 and C9 use it", status: DERIVED}
  min_slit_clamped: {value: 0.5, unit: mm, source: "Echo registry seed", status: ASSUMED}
  min_wall: {value: 1.2, unit: mm, source: "design rule: minimum collet wall at the cone top, checked by C6 and C9 (formerly print.min_wall); not a printer value", status: ASSUMED}
  web_strain_allow: {value: 0.01, unit: "", source: "Register row (design assumption, not a material property)", status: ASSUMED}
  relief_hole_dia: {value: 8.0, unit: "mm", source: "strain 4 x delta / (2 x collet.slit_length x hole) <= collet.web_strain_allow needs slit_length x hole >= 183.26; 25.0 x 8.0 = 200, ratio 0.916 (research/quinn/cr_scratch/step3_geometry_crossreview.md)", status: DERIVED}
  foot_ring_width: {value: 3.2, unit: "mm", source: "radial lip beyond the free cone base: ring outer r 66.99 (register r 67.29 - fit.seat_clearance 0.30) - 63.79; was 10, which put the ring 6.5 outside the register bore (research/quinn/cr_scratch/step3_geometry_crossreview.md)", status: DERIVED}
  core_seat_height: {value: 2.5, unit: "mm", source: "Topologist W-2: relief hole bottom z 3.0 clears the ledge top by 0.5 (no OCC tangency); ledge shear 0.30 MPa at 204 N (research/quinn/cr_scratch/step3_geometry_crossreview.md)", status: ASSUMED}
  core_seat_width: {value: 3, unit: "mm", source: "core weight seat width, leaves the bore open (Designer name core_stop_width, renamed)", status: ASSUMED}
  rim_notch_count: {value: "clamp(floor((d - core.diameters[0]) / collets.spacing + 0.5) + 1, 1, collets.count)", unit: "", source: "family index 1 to 7 from core.diameters (single source); notch count and colour index mark the size; the generator applies the clamped half-up form clamp(floor((d - core.diameters[0]) / collets.spacing + 0.5) + 1, 1, collets.count); the clamp keeps d 85 (unclamped -1) and d 106.585 (unclamped 8) inside 1 to 7; 97.0 gives 4, 93.7 gives 2 (research/quinn/cr_scratch/step5_loftsman_collet_definition.md correction 3)", status: DERIVED}
  notch_azimuth_offsets_deg: {value: [60, 90, 120, 180, 210, 240, 300], unit: deg, source: "rim notch azimuths relative to receiver.key_offset_deg; the first rim_notch_count entries are cut; each lies 15 deg from the nearest slit and relief hole (research/quinn/cr_scratch/step5_loftsman_collet_definition.md)", status: ASSUMED}
  label_azimuth_offset_deg: {value: -30, unit: deg, source: "label window centre relative to receiver.key_offset_deg; off the probe azimuths 67, 187, 307 and clear of every slit (research/quinn/cr_scratch/step5_loftsman_collet_definition.md)", status: ASSUMED}
  label_window_width: {value: 24, unit: mm, source: "label window chord, tangential; 3 mm margin to the nearest slit edge (research/quinn/cr_scratch/step5_loftsman_collet_definition.md)", status: ASSUMED}
  tool_overshoot: {value: 1.0, unit: mm, source: "boolean tool extent beyond a part face so no tool face is coincident with a part face; not a part dimension (research/quinn/cr_scratch/step5_loftsman_collet_definition.md)", status: ASSUMED}
  rim_notch_width: {value: 6, unit: "mm", source: "rim notch (research/quinn/cr_scratch/step3_designer_params.md)", status: ASSUMED}
  rim_notch_depth: {value: 3, unit: "mm", source: "rim notch (research/quinn/cr_scratch/step3_designer_params.md)", status: ASSUMED}
  label_text_format: {value: "d | lo-hi", unit: "", source: "grip-window label, lo and hi from collet.grip_window_lo/hi", status: ASSUMED}
  label_height: {value: 8, unit: "mm", source: "at least 6 per S2-4", status: ASSUMED}
  label_depth: {value: 0.8, unit: "mm", source: "label relief depth", status: ASSUMED}
  file_name_pattern: {value: "collet_{int}p{frac}", unit: "", source: "file name, e.g. collet_092p5 for 92.5 mm", status: ASSUMED}
  chamfer_lead_in: {value: "min(wall - collet.min_wall, 10.5); 2.5 where wall - collet.min_wall lies in (2.5, 3.5)", unit: "", source: "Topologist line 65 fix, orchestrator ruling: chamfer edge z = 32 - c clears relief hole top 29.0 and bottom 21.0 (and 3.0, 11.0) by at least 0.5 for d 85 to 106.585 (10.5 at d 90.6, edge z 21.5; 2.5 at d 106.585, edge z 29.5); floor collet.chamfer_floor (research/quinn/cr_scratch/step3_geometry_crossreview.md)", status: DERIVED}
  chamfer_cap: {value: 10.5, unit: mm, source: "upper bound of the chamfer rule min(wall - collet.min_wall, 10.5) (collet.chamfer_lead_in text); the relief-hole edge clearance 0.5 holds for d 85 to 106.585", status: DERIVED}
  chamfer_band_lo: {value: 2.5, unit: mm, source: "lower edge of the (2.5, 3.5) band where the chamfer is fixed at collet.chamfer_band_lo (collet.chamfer_lead_in text; keeps the chamfer edge 0.5 clear of the relief-hole top at d above 105.6)", status: DERIVED}
  chamfer_band_hi: {value: 3.5, unit: mm, source: "upper edge of the (2.5, 3.5) band in the chamfer rule (collet.chamfer_lead_in text)", status: DERIVED}
  chamfer_angle_deg: {value: 45, unit: deg, source: "bore lead-in chamfer angle from the axis; the lip fillet turns through the same angle (research/quinn/cr_scratch/step5_loftsman_collet_definition.md)", status: ASSUMED}
  chamfer_floor: {value: 1.5, unit: "mm", source: "chamfer floor at 45 deg (research/quinn/cr_scratch/step3_designer_params.md R3)", status: ASSUMED}
  bore_lip_radius: {value: 1.0, unit: "mm", source: "bore lip radius (research/quinn/cr_scratch/step3_designer_params.md)", status: ASSUMED}
  colour: {value: ["red", "orange", "yellow", "green", "blue", "violet", "white"], unit: "", source: "colour per size, smallest to largest; a finish, not a printer input; redundant with notch count", status: ASSUMED}
  slit_ligament: {value: 3.0, unit: "mm", source: "axial, relief hole edge to far end face; hole bottom z 3.0 clears ring top z 2.0 (research/quinn/cr_scratch/step3_geometry_crossreview.md)", status: ASSUMED}
  slit_length: {value: 25.0, unit: "mm", source: "axial, open face to relief hole centre: 32 - (collet.slit_ligament 3.0 + collet.relief_hole_dia 8.0 / 2) (research/quinn/cr_scratch/step3_geometry_crossreview.md)", status: DERIVED}

thread:
  pitch: {value: 8, unit: "mm", source: "Design Notes 3 seed, carried by research/quinn/cr_scratch/step2_loftsman_crossreview_reply.md (hand, pitch 8)", status: ASSUMED}
  flank_deg: {value: 45, unit: "deg", source: "Design Notes 3 symmetric 45/45 seed, carried by research/quinn/cr_scratch/step2_loftsman_crossreview_reply.md", status: ASSUMED}
  starts: {value: 1, unit: "", source: "Design Notes 3 single start, carried by research/quinn/cr_scratch/step2_loftsman_crossreview_reply.md", status: ASSUMED}
  min_engage_pitches: {value: 3, unit: "", source: "Echo registry seed", status: ASSUMED}
  major: {value: 149.58, unit: "mm", source: "closed form D_T = B_f + 2 t_c + 2 H tan(alpha) - Delta + 2 (t_h + g_reg + t_b + h) (research/quinn/cr_scratch/step2_loftsman_crossreview_reply.md D-1); replaces the 165 seed", status: DERIVED}
  minor: {value: 144.58, unit: "mm", source: "research/quinn/cr_scratch/step2_loftsman_crossreview_reply.md section 4", status: DERIVED}
  hand: {value: "right", unit: "", source: "research/quinn/cr_scratch/step2_loftsman_crossreview_reply.md section 6 (hand, pitch 8, 45/45, single start)", status: ASSUMED}
  lead_in_length: {value: 1.25, unit: "mm", source: "receiver rim 45 deg chamfer from crest r 74.79 to pitch r 73.54; was 8 (one pitch at each end leaves 10.87 full-form at pose R, below 24) (research/quinn/cr_scratch/step3_geometry_crossreview.md)", status: DERIVED}
  land_width: {value: 1.5, unit: "mm", source: "crest flat = thread.pitch / 2 - chain.h x tan(thread.flank_deg) = 4 - 2.5; was 1.0, which breaks the P/2 tooth at the pitch line (research/quinn/cr_scratch/step3_geometry_crossreview.md)", status: DERIVED}
  nut_lead_in_length: {value: 0.9, unit: "mm", source: "nut skirt-bottom 45 deg chamfer from crest r 72.64 to pitch r 73.54 (research/quinn/cr_scratch/step3_geometry_crossreview.md)", status: DERIVED}
  run_turns: {value: 6, unit: "", source: "thread run is 6 turns from the receiver rim: 48.0 = 6 x thread.pitch (Loftsman step3 section 1, closed at Step 2) (research/quinn/cr_scratch/step3_engineer_first_solids.md)", status: DERIVED}
  runout_land: {value: 4.0, unit: "mm", source: "receiver runout land below the thread run, root radius, z 36.5 to 40.5 (Loftsman step3 section 1) (research/quinn/cr_scratch/step3_engineer_first_solids.md)", status: ASSUMED}
  tool_groove_fraction: {value: 0.9, unit: "", source: "helical sweep tool groove height must stay below 0.9 x pitch (freecad_api_reference helix rule); sets tool overshoot, not a part dimension (research/quinn/cr_scratch/step3_engineer_first_solids.md)", status: ASSUMED}

cone:
  alpha: {value: 10, unit: "deg", source: "taper half-angle; self-lock tan 10 = 0.176 < mu_k,min 0.25 (research/quinn/cr_scratch/step2_loftsman_crossreview_reply.md section 6; research/quinn/cr_scratch/step2_system_concept.md decision 2)", status: ASSUMED}
  alpha_release: {value: 20, unit: "deg", source: "RETIRED releasing-cone fallback, reference only: misses 10 N m at d = 90 within 12 N m and costs +11.26 mm of thread major (research/quinn/cr_scratch/step2_system_concept.md decision 2)", status: ASSUMED}

chain:
  t_c: {value: 5, unit: mm, source: "Design Notes 3 seed", status: ASSUMED}
  H: {value: 30, unit: mm, source: "Design Notes 3 seed", status: ASSUMED}
  t_h: {value: 5, unit: mm, source: "Design Notes 3 seed", status: ASSUMED}
  t_b: {value: 5, unit: mm, source: "Design Notes 3 seed", status: ASSUMED}
  h: {value: 2.5, unit: mm, source: "Design Notes 3 seed", status: ASSUMED}

fit:
  c_r: {value: 0.35, unit: mm, source: "generic seed; E2 deflection c_r/10 = 0.035 mm; coupon at Step 8 settles", status: ASSUMED}
  g_a: {value: 0.30, unit: mm, source: "generic seed; coupon at Step 8 settles", status: ASSUMED}
  seat_clearance: {value: 0.30, unit: mm, source: "gameplan test F1 seed (formerly print.seat_clearance)", status: ASSUMED}
