  min_contact_patch: {value: 1.0, unit: mm2, source: "A1a floor on the class C patch area per pair (a zero-area line contact fails); positive floor chosen as 1 mm2, below every modelled face contact; seat.min_contact_area governs the holder/collet pair", status: ASSUMED}
  c_r_min: {value: 0.10, unit: mm, source: "T3 floor on measured radial crest clearance: 0.10 = 2 x the E2 tessellation deflection c_r / 10 (0.035) rounded up; built c_r 0.35 passes", status: ASSUMED}
  g_a_min: {value: 0.10, unit: mm, source: "T3 floor on the total axial flank gap at the pitch line: 0.10 = 1/3 of fit.g_a 0.30; built g_a 0.30 passes", status: ASSUMED}

