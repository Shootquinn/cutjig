  holder_bottom_R: {value: 13.626, unit: "mm", source: "2 + z0 + s_z (research/quinn/cr_scratch/step2_loftsman_crossreview_reply.md D-1)", status: DERIVED}
  min_contact_area: {value: 200, unit: mm2, source: "gameplan test F1 seed", status: ASSUMED}

